<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Graphloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #09090b; color: #e4e4e7; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; min-height: 42px; padding: 6px 12px; background: rgba(9,9,11,.94);
         border-bottom: 1px solid #27272a; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #bar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  #bar .crumb { min-width: 0; flex: 1; font-size: 12px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers { display: flex; flex: 0 0 auto; gap: 7px; align-items: center; }
  .lchk { font-size: 11px; color: #a1a1aa; display: flex; gap: 3px; align-items: center; cursor: pointer; white-space: nowrap; }
  #search { flex: 0 0 150px; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; color: #e4e4e7;
            padding: 4px 8px; font-size: 12px; width: 150px; }
  .nav { background: #27272a; border: none; color: #e4e4e7; border-radius: 6px; padding: 4px 9px;
         cursor: pointer; font-size: 12px; }
  .nav:disabled { opacity: .4; cursor: default; }
  #stage { position: fixed; inset: 0; top: 42px; overflow: auto; padding: 24px 0 40px; }
  svg { display: block; }
  .node { cursor: pointer; }
  .node rect, .node polygon { transition: filter .15s; }
  .node:hover rect, .node:hover polygon { filter: brightness(1.25); }
  .node.dim, .edge.dim { opacity: .12; }
  .edge { stroke: #52525b; stroke-width: 1.5; fill: none; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .elabel-bg { fill: #09090b; stroke: #27272a; stroke-width: 1; }
  .elabel { font-size: 10px; fill: #a1a1aa; }
  .nlabel { font-size: 12px; fill: #f4f4f5; font-weight: 500; }
  .nsummary { font-size: 10px; fill: #71717a; }
  .nkind { font-size: 11px; }
  .hit { stroke: #facc15; stroke-width: 2.5; }
  #sidebar { position: fixed; top: 42px; right: 0; bottom: 0; width: 380px; background: #18181b;
             border-left: 1px solid #27272a; padding: 16px; overflow: auto; display: none; z-index: 6; }
  #sidebar h2 { font-size: 16px; margin-bottom: 2px; padding-right: 20px; }
  #sidebar .meta { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  #close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #71717a;
           background: none; border: none; font-size: 16px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
  .chip.on { background: #064e3b; color: #6ee7b7; }
  .chip.off { background: #27272a; color: #71717a; }
  pre.code { margin-top: 12px; background: #09090b; border: 1px solid #27272a; border-radius: 8px;
             padding: 10px; font: 11px/1.6 ui-monospace, monospace; overflow: auto; }
  pre.code .ln { color: #52525b; display: inline-block; width: 34px; user-select: none; }
  pre.code .hl { background: #27272a; display: block; }
  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;
            padding: 5px 12px; cursor: pointer; font-size: 12px; }
</style>

const sources = {"internal/dom/selector.go":"package dom\n\nimport (\n    \"strconv\"\n    \"strings\"\n    \"unicode\"\n)\n\n// SelectorGroup represents a comma-separated list of selectors.\ntype SelectorGroup struct {\n    Selectors []ComplexSelector\n}\n\n// ComplexSelector represents a sequence of simple selectors connected by combinators.\ntype ComplexSelector struct {\n    Parts []SelectorPart\n}\n\n// SelectorPart is a simple selector plus the combinator that precedes it (for parts[1:]).\ntype SelectorPart struct {\n    Tag        string // empty means any tag; \"*\" means universal\n    ID         string\n    Classes    []string\n    Attributes []AttrSelector\n    Pseudos    []PseudoSelector\n    Combinator string // \"\", \" \", \">\", \"+\", \"~\"\n}\n\n// AttrSelector represents an attribute selector.\ntype AttrSelector struct {\n    Name  string\n    Op    string // \"\", \"=\", \"~=\", \"|=\", \"^=\", \"$=\", \"*=\"\n    Value string\n}\n\n// PseudoSelector represents a pseudo-class.\ntype PseudoSelector struct {\n    Name string\n    Arg  string\n}\n\n// ParseSelectorGroup parses a selector string into a selector group.\nfunc ParseSelectorGroup(s string) (*SelectorGroup, error) {\n    s = strings.TrimSpace(s)\n    if s == \"\" {\n        return &SelectorGroup{}, nil\n    }\n\n    var selectors []ComplexSelector\n    for _, part := range splitByComma(s) {\n        part = strings.TrimSpace(part)\n        if part == \"\" {\n            continue\n        }\n        sel, err := parseComplexSelector(part)\n        if err != nil {\n            return nil, err\n        }\n        selectors = append(selectors, sel)\n    }\n    return &SelectorGroup{Selectors: selectors}, nil\n}\n\n// MatchesSelector checks if a node matches the given selector string.\nfunc MatchesSelector(n *Node, selector string) bool {\n    if n == nil || n.Type != ElementNode {\n        return false\n    }\n    group, err := ParseSelectorGroup(selector)\n    if err != nil {\n        return false\n    }\n    for _, sel := range group.Selectors {\n        if matchesComplex(n, sel) {\n            return true\n        }\n    }\n    return false\n}\n\n// QueryAllSelector returns all descendant elements matching the selector.\nfunc QueryAllSelector(root *Node, selector string) []*Node {\n    group, err := ParseSelectorGroup(selector)\n    if err != nil {\n        return nil\n    }\n    var results []*Node\n    queryAllSelectorRecursive(root, group, &results)\n    return results\n}\n\n// QuerySelectorSelector returns the first descendant element matching the selector.\nfunc QuerySelectorSelector(root *Node, selector string) *Node {\n    all := QueryAllSelector(root, selector)\n    if len(all) == 0 {\n        return nil\n    }\n    return all[0]\n}\n\nfunc queryAllSelectorRecursive(n *Node, group *SelectorGroup, results *[]*Node) {\n    for _, child := range n.Children {\n        if child.Type != ElementNode {\n            continue\n        }\n        for _, sel := range group.Selectors {\n            if matchesComplex(child, sel) {\n                *results = append(*results, child)\n                break\n            }\n        }\n        queryAllSelectorRecursive(child, group, results)\n    }\n}\n\nfunc matchesComplex(n *Node, sel ComplexSelector) bool {\n    if len(sel.Parts) == 0 {\n        return false\n    }\n    return matchPart(n, sel.Parts, len(sel.Parts)-1)\n}\n\n// matchPart checks if n matches sel.Parts[idx] and the combinator chain before it.\nfunc matchPart(n *Node, parts []SelectorPart, idx int) bool {\n    if !matchesSimple(n, parts[idx]) {\n        return false\n    }\n    if idx == 0 {\n        return true\n    }\n\n    comb := parts[idx].Combinator\n    switch comb {\n    case \" \", \"\":\n        // descendant\n        for anc := n.Parent; anc != nil; anc = anc.Parent {\n            if matchPart(anc, parts, idx-1) {\n                return true\n            }\n        }\n    case \">\":\n        if n.Parent != nil && matchPart(n.Parent, parts, idx-1) {\n            return true\n        }\n    case \"+\":\n        prev := previousElementSibling(n)\n        if prev != nil && matchPart(prev, parts, idx-1) {\n            return true\n        }\n    case \"~\":\n        for prev := previousElementSibling(n); prev != nil; prev = previousElementSibling(prev) {\n            if matchPart(prev, parts, idx-1) {\n                return true\n            }\n        }\n    }\n    return false\n}\n\nfunc previousElementSibling(n *Node) *Node {\n    if n == nil || n.Parent == nil {\n        return nil\n    }\n    found := false\n    for i := len(n.Parent.Children) - 1; i >= 0; i-- {\n        child := n.Parent.Children[i]\n        if child == n {\n            found = true\n            continue\n        }\n        if found && child.Type == ElementNode {\n            return child\n        }\n    }\n    return nil\n}\n\nfunc matchesSimple(n *Node, part SelectorPart) bool {\n    if n == nil || n.Type != ElementNode {\n        return false\n    }\n\n    // Tag check\n    if part.Tag != \"\" && part.Tag != \"*\" {\n        if !strings.EqualFold(n.TagName, part.Tag) {\n            return false\n        }\n    }\n\n    // ID check\n    if part.ID != \"\" && n.Attributes[\"id\"] != part.ID {\n        return false\n    }\n\n    // Class check\n    classAttr := n.Attributes[\"class\"]\n    for _, c := range part.Classes {\n        if !hasClass(classAttr, c) {\n            return false\n        }\n    }\n\n    // Attribute check\n    for _, attr := range part.Attributes {\n        if !matchesAttr(n, attr) {\n            return false\n        }\n    }\n\n    // Pseudo-class check\n    for _, pseudo := range part.Pseudos {\n        if !matchesPseudo(n, pseudo) {\n            return false\n        }\n    }\n\n    return true\n}\n\nfunc matchesAttr(n *Node, attr AttrSelector) bool {\n    val, exists := n.Attributes[attr.Name]\n    switch attr.Op {\n    case \"\":\n        return exists\n    case \"=\":\n        return val == attr.Value\n    case \"~=\":\n        for _, f := range strings.Fields(val) {\n            if f == attr.Value {\n                return true\n            }\n        }\n        return false\n    case \"|=\":\n        return val == attr.Value || strings.HasPrefix(val, attr.Value+\"-\")\n    case \"^=\":\n        return strings.HasPrefix(val, attr.Value)\n    case \"$=\":\n        return strings.HasSuffix(val, attr.Value)\n    case \"*=\":\n        return strings.Contains(val, attr.Value)\n    }\n    return false\n}\n\nfunc matchesPseudo(n *Node, pseudo PseudoSelector) bool {\n    switch strings.ToLower(pseudo.Name) {\n    case \"first-child\":\n        return childIndex(n, false) == 1\n    case \"last-child\":\n        return lastChildIndex(n, false) == 1\n    case \"only-child\":\n        return childIndex(n, false) == 1 && lastChildIndex(n, false) == 1\n    case \"first-of-type\":\n        return childIndex(n, true) == 1\n    case \"last-of-type\":\n        return lastChildIndex(n, true) == 1\n    case \"only-of-type\":\n        return childIndex(n, true) == 1 && lastChildIndex(n, true) == 1\n    case \"nth-child\":\n        idx := childIndex(n, false)\n        return matchNth(pseudo.Arg, idx)\n    case \"nth-of-type\":\n        idx := childIndex(n, true)\n        return matchNth(pseudo.Arg, idx)\n    case \"nth-last-child\":\n        idx := lastChildIndex(n, false)\n        return matchNth(pseudo.Arg, idx)\n    case \"nth-last-of-type\":\n        idx := lastChildIndex(n, true)\n        return matchNth(pseudo.Arg, idx)\n    case \"not\":\n        return !MatchesSelector(n, pseudo.Arg)\n    case \"is\", \"where\":\n        return MatchesSelector(n, pseudo.Arg)\n    case \"empty\":\n        for _, c := range n.Children {\n            if c.Type == ElementNode || c.Type == TextNode && strings.TrimSpace(c.Text) != \"\" {\n                return false\n            }\n        }\n        return true\n    case \"checked\":\n        return n.GetAttr(\"checked\") != \"\"\n    case \"disabled\":\n        return n.GetAttr(\"disabled\") != \"\"\n    case \"enabled\":\n        return n.GetAttr(\"disabled\") == \"\"\n    case \"selected\":\n        return n.GetAttr(\"selected\") != \"\"\n    case \"focus\":\n        // Abyss has no focus management\n        return false\n    case \"root\":\n        return n.Type == DocumentNode\n    }\n    return false\n}\n\n// childIndex returns the 1-based index of n among its parent's element children.\n// If ofType is true, only counts children with the same tag.\nfunc childIndex(n *Node, ofType bool) int {\n    if n == nil || n.Parent == nil {\n        return 0\n    }\n    idx := 0\n    for _, child := range n.Parent.Children {\n        if child.Type != ElementNode {\n            continue\n        }\n        if !ofType || strings.EqualFold(child.TagName, n.TagName) {\n            idx++\n        }\n        if child == n {\n            return idx\n        }\n    }\n    return 0\n}\n\n// lastChildIndex returns the 1-based index of n counting from the last element child.\nfunc lastChildIndex(n *Node, ofType bool) int {\n    if n == nil || n.Parent == nil {\n        return 0\n    }\n    idx := 0\n    for i := len(n.Parent.Children) - 1; i >= 0; i-- {\n        child := n.Parent.Children[i]\n        if child.Type != ElementNode {\n            continue\n        }\n        if !ofType || strings.EqualFold(child.TagName, n.TagName) {\n            idx++\n        }\n        if child == n {\n            return idx\n        }\n    }\n    return 0\n}\n\nfunc matchNth(arg string, idx int) bool {\n    arg = strings.TrimSpace(strings.ToLower(arg))\n    if arg == \"\" {\n        return false\n    }\n\n    // Handle keywords\n    switch arg {\n    case \"even\":\n        return idx%2 == 0\n    case \"odd\":\n        return idx%2 == 1\n    }\n\n    // Parse an+b format\n    a, b, ok := parseNth(arg)\n    if !ok {\n        // Try plain number\n        n, err := strconv.Atoi(arg)\n        if err != nil {\n            return false\n  i := 0\n\n    // skip initial whitespace\n    for i < len(s) && unicode.IsSpace(rune(s[i])) {\n        i++\n    }\n\n    for i < len(s) {\n        part, consumed, err := parseSimpleSelectorSequence(s[i:])\n        if err != nil {\n            return ComplexSelector{}, err\n        }\n        if consumed == 0 {\n            break\n        }\n        parts = append(parts, part)\n        i += consumed\n\n        // skip whitespace after the simple selector\n        hasSpace := false\n        for i < len(s) && unicode.IsSpace(rune(s[i])) {\n            hasSpace = true\n            i++\n        }\n\n        if i >= len(s) {\n            break\n        }\n\n        // determine combinator\n        comb := \"\"\n        if s[i] == '>' || s[i] == '+' || s[i] == '~' {\n            comb = string(s[i])\n            i++\n            // skip whitespace after explicit combinator\n            for i < len(s) && unicode.IsSpace(rune(s[i])) {\n                i++\n            }\n        } else if hasSpace {\n            comb = \" \"\n        }\n\n        if i >= len(s) {\n            break\n        }\n\n        // if we set a combinator, store it on the next part we'll parse\n        if comb != \"\" {\n            nextPart, nextConsumed, err := parseSimpleSelectorSequence(s[i:])\n            if err != nil {\n                return ComplexSelector{}, err\n            }\n            nextPart.Combinator = comb\n            parts = append(parts, nextPart)\n            i += nextConsumed\n        }\n    }\n\n    return ComplexSelector{Parts: parts}, nil\n}\n\nfunc parseSimpleSelectorSequence(s string) (SelectorPart, int, error) {\n    var part SelectorPart\n    i := 0\n    first := true\n    for i < len(s) {\n        // Skip whitespace only between sequences (not within)\n        if unicode.IsSpace(rune(s[i])) {\n            break\n        }\n\n        switch s[i] {\n        case '*':\n            if first {\n                part.Tag = \"*\"\n                i++\n                first = f const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
function textWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

function wrapText(text, maxW, font) {
  const words = (text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (textWidth(test, font) <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [text || ""];
}

function nodeMetrics(n) {
  const s = styleOf(n);
  const isDecision = n.kind === "decision";
  const labelFont = "500 12px system-ui, sans-serif";
  const summaryFont = "10px system-ui, sans-serif";
  const maxTextW = isDecision ? 200 : 240;
  const labelLines = wrapText(n.label, maxTextW, labelFont);
  const summaryLines = n.summary && !isDecision ? wrapText(n.summary, maxTextW, summaryFont) : [];
  const labelW = Math.max(...labelLines.map(l => textWidth(l, labelFont)), 0);
  const summaryW = Math.max(...summaryLines.map(l => textWidth(l, summaryFont)), 0);
  const hasIcon = !isDecision;
  const innerW = Math.max(labelW, summaryW) + (hasIcon ? 40 : 0);
  const minW = isDecision ? 180 : 160;
  const maxW = isDecision ? 260 : 320;
  const width = Math.max(minW, Math.min(maxW, innerW + 32));
  const lineH = 14;
  const labelH = 12 + (labelLines.length - 1) * lineH;
  const summaryH = summaryLines.length ? 6 + summaryLines.length * lineH : 0;
  const height = 28 + labelH + summaryH;
  return { width, height, labelLines, summaryLines, labelH, summaryH, isDecision, hasIcon, color: s.color, icon: s.icon };
}

function sequentialize(arcs, visible, level) {
  if (level !== "file" && level !== "function") return arcs;
  const lineOf = id => {
    const n = visible.find(x => x.id === id);
    return n && n.source ? n.source.start_line : 0;
  };
  const out = {};
  arcs.forEach(a => { (out[a.from] = out[a.from] || []).push(a); });
  const keep = new Set();
  const add = [];
  Object.keys(out).forEach(src => {
    const srcNode = visible.find(x => x.id === src);
    if (!srcNode || srcNode.kind === "decision") return;
    const outs = out[src]
      .filter(a => visible.find(x => x.id === a.to))
      .slice()
      .sort((a, b) => lineOf(a.to) - lineOf(b.to));
    if (outs.length < 2) return;
    keep.add(`${outs[0].from}→${outs[0].to}`);
    for (let i = 1; i < outs.length; i++) {
      add.push({ from: outs[i - 1].to, to: outs[i].to, label: outs[i].label });
    }
  });
  return arcs.filter(a => {
    const srcNode = visible.find(x => x.id === a.from);
    if (srcNode && srcNode.kind === "decision") return true;
    if (!out[a.from] || out[a.from].length < 2) return true;
    return keep.has(`${a.from}→${a.to}`);
  }).concat(add);
}

function layeredLayout(nodes, edges) {
  const visible = nodes.filter(n => activeLayers.has(n.layer));
  const ids = new Set(visible.map(n => n.id));
  let arcs = edges.filter(e => ids.has(e.from) && ids.has(e.to)).map(e => ({ ...e }));
  visible.forEach(n => {
    if (n.kind === "decision" && n.branches) {
      n.branches.forEach(b => {
        if (ids.has(b.target)) arcs.push({ from: n.id, to: b.target, label: b.condition });
      });
    }
  });
  arcs = sequentialize(arcs, visible, viz.level);

  const layer = {};
  visible.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < visible.length; i++) {
    arcs.forEach(a => { if (layer[a.to] <= layer[a.from]) layer[a.to] = layer[a.from] + 1; });
  }

  const metrics = {};
  visible.forEach(n => metrics[n.id] = nodeMetrics(n));

  const groups = new Map();
  visible.forEach(n => {
    const l = layer[n.id];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(n);
  });

  const preds = {};
  arcs.forEach(a => { (preds[a.to] = preds[a.to] || []).push(a.from); });

  const sortedLayers = [...groups.keys()].sort((a, b) => a - b);
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    group.forEach(n => {
      const ps = (preds[n.id] || []).filter(p => metrics[p]._pos);
      n._bary = ps.length ? ps.reduce((s, p) => s + metrics[p]._pos.x + metrics[p].width / 2, 0) / ps.length : Infinity;
    });
    group.sort((a, b) => (a._bary - b._bary) || a.id.localeCompare(b.id));
    let x = 40;
    group.forEach(n => {
      metrics[n.id]._pos = { x, y: 0 };
      x += metrics[n.id].width + 40;
    });
  });

  let maxLayerWidth = 0;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const last = group[group.length - 1];
    const w = metrics[last.id]._pos.x + metrics[last.id].width;
    if (w > maxLayerWidth) maxLayerWidth = w;
  });

  let y = 40;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const maxH = Math.max(...group.map(n => metrics[n.id].height));
    group.forEach(n => { metrics[n.id]._pos.y = y + (maxH - metrics[n.id].height) / 2; });
    const layerW = Math.max(...group.map(n => metrics[n.id]._pos.x + metrics[n.id].width));
    const offset = (maxLayerWidth - layerW) / 2;
    group.forEach(n => { metrics[n.id]._pos.x += Math.max(0, offset); });
    y += maxH + 70;
  });

  return { visible, arcs, metrics };
}

function treeLayout(nodes) {
  const root = nodes[0];
  function filter(node) {
    const children = (node.children || []).filter(c => activeLayers.has(c.layer)).map(filter);
    return { node, children };
  }
  const tree = filter(root);

  function measure(t) {
    const m = nodeMetrics(t.node);
    t.metrics = m;
    if (t.children.length) {
      let sub = 0;
      t.children.forEach(c => {
        measure(c);
        sub += c.subW + 40;
      });
      sub -= 40;
      t.subW = Math.max(m.width, sub);
    } else {
      t.subW = m.width;
    }
  }
  measure(tree);

  function place(t, x, y) {
    const m = t.metrics;
    t.node._pos = { x: x + t.subW / 2 - m.width / 2, y };
    let cx = x;
    const childY = y + m.height + 50;
    t.children.forEach(c => {
      place(c, cx, childY);
      cx += c.subW + 40;
    });
  }
  place(tree, 40, 40);

  const flat = [];
  function collect(t) {
    flat.push(t.node);
    t.children.forEach(collect);
  }
  collect(tree);

  // compute edges: parent -> first child and sequential siblings
  const edges = [];
  function walk(t) {
    if (t.children.length) {
      edges.push({ from: t.node.id, to: t.children[0].node.id, label: null, status: null });
      for (let i = 1; i < t.children.length; i++) {
        edges.push({ from: t.children[i - 1].node.id, to: t.children[i].node.id, label: null, status: null });
      }
      t.children.forEach(walk);
    }
  }
  walk(tree);

  const metrics = {};
  flat.forEach(n => metrics[n.id] = nodeMetrics(n));
  return { visible: flat, arcs: edges, metrics };
}

function isTreeView(view) {
  return view.nodes.length === 1 && view.edges.length === 0 && view.nodes[0].children && view.nodes[0].children.length > 0;
}

const NS = "http://www.w3.org/2000/svg";
let query = "";

function render() {
  const view = current();
  document.getElementById("crumb").textContent = view.title;
  document.getElementById("back").disabled = cursor === 0;
  document.getElementById("fwd").disabled = cursor === views.length - 1;

  const isTree = isTreeView(view);
  const { visible, arcs, metrics } = isTree
    ? treeLayout(view.nodes)
    : layeredLayout(view.nodes, view.edges);

  const svg = document.getElementById("svg");
  svg.innerHTML = "";
  const stage = document.getElementById("stage");
  let maxX = 0, maxY = 0;
  visible.forEach(n => {
    const m = metrics[n.id];
    maxX = Math.max(maxX, m._pos.x + m.width + 40);
    maxY = Math.max(maxY, m._pos.y + m.height + 40);
  });
  svg.setAttribute("width", Math.max(maxX, stage.clientWidth));
  svg.setAttribute("height", Math.max(maxY, stage.clientHeight));

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/></marker>';
  svg.appendChild(defs);

  const matches = q => n => q && (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
  const isHit = matches(query);

  arcs.forEach(a => {
    const m1 = metrics[a.from], m2 = metrics[a.to];
    const p1 = m1._pos, p2 = m2._pos;
    const sx = p1.x + m1.width / 2;
    const sy = p1.y + m1.height;
    const tx = p2.x + m2.width / 2;
    const ty = p2.y;
    const dy = Math.max(ty - sy, 30);
    const c1y = sy + dy * 0.45;
    const c2y = ty - dy * 0.45;
    const d = `M ${sx} ${sy} C ${sx} ${c1y}, ${tx} ${c2y}, ${tx} ${ty}`;

    const line = document.createElementNS(NS, "path");
    line.setAttribute("d", d);
    const status = view.edges.find(e => e.from === a.from && e.to === a.to);
    line.setAttribute("class", "edge" + (status && status.status === "inferred" ? " inferred" : ""));
    line.setAttribute("marker-end", "url(#arr)");
    if (query && !(isHit(visible.find(n => n.id === a.from)) && isHit(visible.find(n => n.id === a.to)))) line.classList.add("dim");
    svg.appendChild(line);

    if (a.label) {
      const len = line.getTotalLength();
      const pt = line.getPointAtLength(len / 2);
      const lw = textWidth(a.label, "10px system-ui, sans-serif") + 12;
      const bg = document.createElementNS(NS, "rect");
      bg.setAttribute("class", "elabel-bg");
      bg.setAttribute("x", pt.x - lw / 2);
      bg.setAttribute("y", pt.y - 10);
      bg.setAttribute("width", lw);
      bg.setAttribute("height", 20);
      bg.setAttribute("rx", 6);
      svg.appendChild(bg);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "elabel");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", pt.y + 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = a.label;
      svg.appendChild(t);
    }
  });

  visible.forEach(n => {
    const p = metrics[n.id]._pos;
    const m = metrics[n.id];
    const s = styleOf(n);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node" + (query && !isHit(n) ? " dim" : ""));
    let shape;
    if (n.kind === "decision") {
      shape = document.createElementNS(NS, "polygon");
      const w = m.width, h = m.height;
      shape.setAttribute("points", `${p.x + w/2},${p.y} ${p.x + w},${p.y + h/2} ${p.x + w/2},${p.y + h} ${p.x},${p.y + h/2}`);
    } else {
      shape = document.createElementNS(NS, "rect");
      shape.setAttribute("x", p.x); shape.setAttribute("y", p.y);
      shape.setAttribute("width", m.width); shape.setAttribute("height", m.height);
      shape.setAttribute("rx", 12);
    }
    shape.setAttribute("fill", "#18181b");
    shape.setAttribute("stroke", s.color);
    shape.setAttribute("stroke-width", 2);
    if (query && isHit(n)) shape.setAttribute("class", "hit");
    g.appendChild(shape);

    if (m.hasIcon) {
      const icon = document.createElementNS(NS, "g");
      icon.setAttribute("transform", `translate(${p.x + 22} ${p.y + m.height/2 - 8}) scale(.6)`);
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", s.color);
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.innerHTML = ICON_PATHS[s.icon] || ICON_PATHS.Box;
      g.appendChild(icon);
    }

    const textX = m.hasIcon ? p.x + 46 : p.x + 16;
    const labelMaxW = m.width - (m.hasIcon ? 56 : 26);
    const labelLines = wrapText(n.label, labelMaxW, "500 12px system-ui, sans-serif");
    labelLines.forEach((ln, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "nlabel");
      t.setAttribute("x", textX);
      t.setAttribute("y", p.y + 22 + i * 14);
      t.textContent = ln;
      g.appendChild(t);
    });

    if (n.summary && n.kind !== "decision") {
      const summaryLines = wrapText(n.summary, labelMaxW, "10px system-ui, sans-serif");
      summaryLines.forEach((ln, i) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("class", "nsummary");
        t.setAttribute("x", textX);
        t.setAttribute("y", p.y + 24 + labelLines.length * 14 + 6 + i * 14);
        t.textContent = ln;
        g.appendChild(t);
      });
    }

    if (n.tests) {
      ["unit", "integration", "e2e"].forEach((k, i) => {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", p.x + m.width - 14 - i * 12); dot.setAttribute("cy", p.y + 14);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", n.tests[k] ? ["#34d399", "#60a5fa", "#f472b6"][i] : "#3f3f46");
        g.appendChild(dot);
      });
    }

    g.addEventListener("click", () => {
      if (n.children && n.children.length) {
        openView(n.label, n.children, []);
      } else if (n.symbol) {
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: n.symbol }, "*");
      } else {
        showSidebar(n);
      }
    });
    svg.appendChild(g);
  });
}

function showSidebar(n) {
  const s = styleOf(n);
  document.getElementById("s-title").textContent = n.label;
  document.getElementById("s-meta").textContent =
    s.icon + " " + n.kind + (n.element_type ? " · " + n.element_type : "") +
    (n.confidence != null ? " · confidence " + n.confidence.toFixed(2) : "");
  document.getElementById("s-tests").innerHTML = n.tests
    ? ["unit", "integration", "e2e"].map(k =>
        '<span class="chip ' + (n.tests[k] ? "on" : "off") + '">' + k + "</span>").join("")
    : "";
  document.getElementById("s-summary").textContent = n.summary || "";

  const extra = document.getElementById("s-extra");
  extra.innerHTML = "";

  const refs = document.getElementById("s-refs");
  refs.innerHTML = "";
  if (n.cross_refs && n.cross_refs.length) {
    const title = document.createElement("div");
    title.className = "meta";
    title.textContent = "Связи:";
    refs.appendChild(title);
    const list = document.createElement("div");
    for (const ref of n.cross_refs) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = ref.label;
      a.style.display = "block";
      a.style.color = "#60a5fa";
      a.style.marginTop = "4px";
      a.style.textDecoration = "none";
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: ref.id, file: ref.file }, "*");
      });
      list.appendChild(a);
    }
    refs.appendChild(list);
  }

  if (n.kind === "call" && n.children && n.children.length) {
    const btn = document.createElement("button");
    btn.className = "expand";
    btn.textContent = "Раскрыть flow";
    btn.addEventListener("click", () => {
      document.getElementById("sidebar").style.display = "none";
      openView(n.label, n.children, []);
    });
    extra.appendChild(btn);
  }

  const code = document.getElementById("s-code");
  if (n.source && sources[n.source.file]) {
    const lines = sources[n.source.file].split("\n");
    const from = Math.max(1, n.source.start_line - 2);
    const to = Math.min(lines.length, n.source.end_line + 2);
    let html = "";
    for (let i = from; i <= to; i++) {
      const esc = lines[i - 1].replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const body = '<span class="ln">' + i + "</span>" + esc;
      html += i >= n.source.start_line && i <= n.source.end_line
        ? '<span class="hl">' + body + "</span>" : body + "\n";
    }
    code.innerHTML = html;
    code.style.display = "block";
  } else {
    code.style.display = "none";
  }
  document.getElementById("sidebar").style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("sidebar").style.display = "none";
});
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
