<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #bar .crumb { min-width: 0; flex: 1; font-size: 12px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers { display: flex; flex: 0 0 auto; gap: 7px; align-items: center; }
  .lchk { font-size: 11px; color: #a1a1aa; display: flex; gap: 3px; align-items: center; cursor: pointer; white-space: nowrap; }

            padding: 4px 8px; font-size: 12px; width: 150px; }
  .nav, .tool { background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 6px;
         cursor: pointer; font-size: 12px; }
  .nav { padding: 4px 9px; }
  .nav:disabled, .tool:disabled { opacity: .4; cursor: default; }
  .tool { width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .tool:hover:not(:disabled), .nav:hover:not(:disabled) { background: #3f3f46; }
  .tool svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #stage { position: fixed; inset: 0; top: 36px; overflow: auto; padding: 0; background: #0b0d12; }
  #stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .22;
                  background-image: linear-gradient(#202533 1px, transparent 1px), linear-gradient(90deg, #202533 1px, transparent 1px);
                  background-size: 32px 32px; }
  svg { display: block; position: relative; z-index: 1; overflow: visible; }
  .scope-region { pointer-events: none; }
  .scope-region rect { stroke-width: 1.2; }
  .scope-region.dim { opacity: .14; }
  .node { cursor: pointer; }
  .collapse-toggle { cursor: pointer; }
  .collapse-toggle text { pointer-events: none; }
  .collapse-toggle:hover rect { filter: brightness(1.25); }
  .node rect { transition: filter .15s, stroke-width .15s; }
  .node:hover rect { filter: brightness(1.18); }
  .node.root rect { stroke-width: 2.5; }
  .node.dim, .edge.dim { opacity: .14; }
  .edge { stroke: #4b5563; stroke-width: 1.25; fill: none; opacity: .9; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .elabel-bg { fill: #09090b; stroke: #27272a; stroke-width: 1; }
  .elabel { font-size: 10px; fill: #a1a1aa; }
  .nlabel { font-size: 11px; fill: #f4f4f5; font-weight: 500; }
  .nsummary { font-size: 9px; fill: #71717a; }
  .nkind { font-size: 11px; }
  .hit { stroke: #facc15; stroke-width: 2.5; }
  #sidebar { position: fixed; top: 36px; right: 0; bottom: 0; width: 380px; background: #18181b;
             border-left: 1px solid #27272a; padding: 16px; overflow: auto; display: none; z-index: 6; }
  #sidebar h2 { font-size: 16px; margin-bottom: 2px; padding-right: 20px; }
  #sidebar .meta { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  #close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #71717a;
           background: none; border: none; font-size: 16px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
  .chip.on { background: #064e3b; color: #6ee7b7; }
  .chip.off { background: #27272a; color: #71717a; }
  pre.code { margin-top: 12px; background: #09090b; border: 1px solid #27272a; border-radius: 8px;

  pre.code .ln { color: #52525b; display: inline-block; width: 34px; user-select: none; }
  pre.code .hl { background: #27272a; display: block; }
  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;

  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;

const sources = {"internal/css/computed_values.go":"// CSS value parsers: convert raw property values into typed computed-style values.\npackage css\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n\t\"strings\"\n)\n\n// DisplayType represents the CSS display property.\ntype DisplayType int\n\nconst (\n\tDisplayBlock DisplayType = iota\n\tDisplayInline\n\tDisplayFlex\n\tDisplayGrid\n\tDisplayNone\n)\n\n// PositionType represents the CSS position property.\ntype PositionType int\n\nconst (\n\tPositionStatic PositionType = iota\n\tPositionRelative\n\tPositionAbsolute\n)\n\n// OverflowType represents the CSS overflow property.\ntype OverflowType int\n\nconst (\n\tOverflowVisible OverflowType = iota\n\tOverflowHidden\n)\n\n// FlexDirection represents flex-direction.\ntype FlexDirection int\n\nconst (\n\tFlexDirectionRow FlexDirection = iota\n\tFlexDirectionColumn\n)\n\n// JustifyContent represents justify-content.\ntype JustifyContent int\n\nconst (\n\tJustifyFlexStart JustifyContent = iota\n\tJustifyCenter\n\tJustifyFlexEnd\n\tJustifySpaceBetween\n\tJustifySpaceAround\n)\n\n// AlignItems represents align-items.\ntype AlignItems int\n\nconst (\n\tAlignFlexStart AlignItems = iota\n\tAlignCenter\n\tAlignFlexEnd\n\tAlignStretch\n)\n\n// BorderStyle represents the border style.\ntype BorderStyle int\n\nconst (\n\tBorderNone BorderStyle = iota\n\tBorderSolid\n)\n\n// Length структура для представления CSS-длины.\ntype Length struct {\n\tIsAuto    bool\n\tPx        float64\n\tIsPercent bool\n\tPercent   float64\n}\n\n// Auto возвращает Length{IsAuto: true}.\nfunc Auto() Length {\n\treturn Length{IsAuto: true}\n}\n\n// Px возвращает Length{Px: v}.\nfunc Px(v float64) Length {\n\treturn Length{Px: v}\n}\n\n// Percent возвращает Length{IsPercent: true, Percent: v}.\nfunc Percent(v float64) Length {\n\treturn Length{IsPercent: true, Percent: v}\n}\n\n// Resolve решает длину относительно опорного значения (для процентов).\nfunc (l Length) Resolve(ref float64) float64 {\n\tif l.IsAuto {\n\t\treturn 0\n\t}\n\tif l.IsPercent {\n\t\treturn l.Percent * ref / 100\n\t}\n\treturn l.Px\n}\n\n// String возвращает строковое представление длины.\nfunc (l Length) String() string {\n\tif l.IsAuto {\n\t\treturn \"auto\"\n\t}\n\tif l.IsPercent {\n\t\treturn fmt.Sprintf(\"%.2f%%\", l.Percent)\n\t}\n\treturn fmt.Sprintf(\"%.2fpx\", l.Px)\n}\n\n// Color структура для представления RGB-цвета.\ntype Color struct {\n\tR, G, B uint8\n\tIsSet   bool\n}\n\n// Transparent возвращает прозрачный цвет.\nfunc Transparent() Color {\n\treturn Color{}\n}\n\n// RGB возвращает цвет из RGB значений.\nfunc RGB(r, g, b uint8) Color {\n\treturn Color{R: r, G: g, B: b, IsSet: true}\n}\n\n// Hex парсит HEX-цвет.\nfunc Hex(s string) Color {\n\tvar r, g, b uint8\n\tif len(s) == 4 {\n\t\t// #RGB\n\t\tr = uint8(hexToInt(string(s[1])) * 17)\n\t\tg = uint8(hexToInt(string(s[2])) * 17)\n\t\tb = uint8(hexToInt(string(s[3])) * 17)\n\t} else if len(s) == 7 {\n\t\t// #RRGGBB\n\t\tr = uint8(hexToInt(s[1:3]))\n\t\tg = uint8(hexToInt(s[3:5]))\n\t\tb = uint8(hexToInt(s[5:7]))\n\t}\n\treturn Color{R: r, G: g, B: b, IsSet: true}\n}\n\n// String возвращает строковое представление цвета.\nfunc (c Color) String() string {\n\tif !c.IsSet {\n\t\treturn \"transparent\"\n\t}\n\treturn fmt.Sprintf(\"#%02x%02x%02x\", c.R, c.G, c.B)\n}\n\n// Border структура для представления CSS-границы.\ntype Border struct {\n\tWidth float64\n\tStyle BorderStyle\n\tColor Color\n}\n\n// BoxModel структура для представления box-model свойств (top, right, bottom, left).\ntype BoxModel struct {\n\tTop, Right, Bottom, Left Length\n}\n\n// IsZero возвращает true, если все стороны равны нулю.\nfunc (b BoxModel) IsZero() bool {\n\treturn b.Top.Px == 0 && b.Right.Px == 0 && b.Bottom.Px == 0 && b.Left.Px == 0\n}\n\n// namedColors отображает именованные CSS-цвета в типы Color.\nvar namedColors = map[string]Color{\n\t\"transparent\": Transparent(),\n\t\"black\":       RGB(0, 0, 0),\n\t\"white\":       RGB(255, 255, 255),\n\t\"red\":         RGB(255, 0, 0),\n\t\"green\":       RGB(0, 128, 0),\n\t\"blue\":        RGB(0, 0, 255),\n\t\"yellow\":      RGB(255, 255, 0),\n\t\"cyan\":        RGB(0, 255, 255),\n\t\"magenta\":     RGB(255, 0, 255),\n\t\"gray\":        RGB(128, 128, 128),\n\t\"lightgray\":   RGB(211, 211, 211),\n\t\"darkgray\":    RGB(169, 169, 169),\n\t\"orange\":      RGB(255, 165, 0),\n\t\"purple\":      RGB(128, 0, 128),\n\t\"pink\":        RGB(255, 192, 203),\n\t\"brown\":       RGB(165, 42, 42),\n}\n\n// parseDisplay парсит значение свойства display в тип DisplayType.\nfunc parseDisplay(val string) DisplayType {\n\tswitch val {\n\tcase \"block\":\n\t\treturn DisplayBlock\n\tcase \"inline\":\n\t\treturn DisplayInline\n\tcase \"flex\":\n\t\treturn DisplayFlex\n\tcase \"grid\":\n\t\treturn DisplayGrid\n\tcase \"none\":\n\t\treturn DisplayNone\n\t}\n\treturn DisplayBlock\n}\n\n// parsePosition парсит значение свойства position в тип PositionType.\nfunc parsePosition(val string) PositionType {\n\tswitch val {\n\tcase \"static\":\n\t\treturn PositionStatic\n\tcase \"relative\":\n\t\treturn PositionRelative\n\tcase \"absolute\":\n\t\treturn PositionAbsolute\n\t}\n\treturn PositionStatic\n}\n\n// parseOverflow парсит значение свойства overflow в тип OverflowType.\nfunc parseOverflow(val string) OverflowType {\n\tswitch val {\n\tcase \"hidden\":\n\t\treturn OverflowHidden\n\tcase \"visible\":\n\t\treturn OverflowVisible\n\t}\n\treturn OverflowVisible\n}\n\n// parseLength парсит CSS-длину (px, %, rem/em, fr, простое число) в тип Length.\nfunc parseLength(val string) Length {\n\tval = strings.TrimSpace(val)\n\tif val == \"auto\" {\n\t\treturn Auto()\n\t}\n\tif strings.HasSuffix(val, \"px\") {\n\t\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"px\"), 64)\n\t\treturn Px(v)\n\t}\n\tif strings.HasSuffix(val, \"%\") {\n\t\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"%\"), 64)\n\t\treturn Percent(v)\n\t}\n\tif strings.HasSuffix(val, \"rem\") || strings.HasSuffix(val, \"em\") {\n\t\t// Treat rem ние float64.\nfunc parseBorderWidth(val string) float64 {\n\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"px\"), 64)\n\treturn v\n}\n\n// parseBorderStyle парсит значение стиля границы в тип BorderStyle.\nfunc parseBorderStyle(val string) BorderStyle {\n\tswitch val {\n\tcase \"none\":\n\t\treturn BorderNone\n\tcase \"solid\":\n\t\treturn BorderSolid\n\t}\n\treturn BorderNone\n}\n\n// parseColor парсит CSS-цвет (именованный, hex, rgb()) в тип Color.\nfunc parseColor(val string) Color {\n\tval = strings.ToLower(strings.TrimSpace(val))\n\tif c, ok := namedColors[val]; ok {\n\t\treturn c\n\t}\n\tif strings.HasPrefix(val, \"#\") {\n\t\treturn Hex(val)\n\t}\n\tif c, ok := parseRgb(val); ok {\n\t\treturn c\n\t}\n\treturn Transparent()\n}\n\n// parseRgb парсит значение rgb(r, g, b) в тип Color. Возвращает ok = false для неизвестных значений.\nfunc parseRgb(val string) (Color, bool) {\n\tif !strings.HasPrefix(val, \"rgb(\") || !strings.HasSuffix(val, \")\") {\n\t\treturn Color{}, false\n\t}\n\tinner := val[4 : len(val)-1]\n\tparts := strings.Split(inner, \",\")\n\tif len(parts) != 3 {\n\t\treturn Color{}, false\n\t}\n\tr, _ := strconv.Atoi(strings.TrimSpace(parts[0]))\n\tg, _ := strconv.Atoi(strings.TrimSpace(parts[1]))\n\tb, _ := strconv.Atoi(strings.TrimSpace(parts[2]))\n\treturn RGB(uint8(r), uint8(g), uint8(b)), true\n}\n\n// parseInt парсит целое число, игнорируя ошибки.\nfunc parseInt(val string) int {\n\tv, _ := strconv.Atoi(strings.TrimSpace(val))\n\treturn v\n}\n\n// parseFloat парсит число с плавающей точкой, игнорируя ошибки.\nfunc parseFloat(val string) float64 {\n\tv, _ := strconv.ParseFloat(strings.TrimSpace(val), 64)\n\treturn v\n}\n\n// parseFlexDirection парсит значение свойства flex-direction в тип FlexDirection.\nfunc parseFlexDirection(val string) FlexDirection {\n\tswitch val {\n\tcase \"row\":\n\t\treturn FlexDirectionRow\n\tcase \"column\":\n\t\treturn FlexDirectionColumn\n\t}\n\treturn FlexDirectionRow\n}\n\n// parseJustifyContent парсит значение свойства justify-content в тип JustifyContent.\nfunc parseJustifyContent(val string) JustifyContent {\n\tswitch val {\n\tcase \"flex-start\":\n\t\treturn JustifyFlexStart\n\tcase \"center\":\n\t\treturn JustifyCenter\n\tcase \"flex-end\":\n\t\treturn JustifyFlexEnd\n\tcase \"space-between\":\n\t\treturn JustifySpaceBetween\n\tcase \"space-around\":\n\t\treturn JustifySpaceAround\n\t}\n\treturn JustifyFlexStart\n}\n\n// parseAlignItems парсит значение свойства align-items в тип AlignItems.\nfunc parseAlignItems(val string) AlignItems {\n\tswitch val {\n\tcase \"flex-start\":\n\t\treturn AlignFlexStart\n\tcase \"center\":\n\t\treturn AlignCenter\n\tcase \"flex-end\":\n\t\treturn AlignFlexEnd\n\tcase \"stretch\":\n\t\treturn AlignStretch\n\t}\n\treturn AlignStretch\n}\n\n// parseLengthList парсит список длин, поддерживая синтаксис repeat().\nfunc parseLengthList(val string) []Length {\n\tvar result []Length\n\tval = strings.TrimSpace(val)\n\n\tfor len(val) > 0 {\n\t\tval = strings.TrimSpace(val)\n\t\tif val == \"\" {\n\t\t\tbreak\n\t\t}\n\n\t\t// Handle repeat() syntax: repeat(3, 1fr)\n\t\tif strings.HasPrefix(val, \"repeat(\") {\n\t\t\tend := strings.Index(val, \")\")\n\t\t\tif end < 0 {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tinner := val[7:end]\n\t\t\tcomma := strings.Index(inner, \",\")\n\t\t\tif comma > 0 {\n\t\t\t\tcount, _ := strconv.Atoi(strings.TrimSpace(inner[:comma]))\n\t\t\t\titem := strings.TrimSpace(inner[comma+1:])\n\t\t\t\tfor i := 0; i < count; i++ {\n\t\t\t\t\tresult = append(result, parseLength(item))\n\t\t\t\t}\n\t\t\t}\n\t\t\tval = val[end+1:]\n\t\t\tcontinue\n\t\t}\n\n\t\t// Find next separator (space or comma)\n\t\tsep := -1\n\t\tfor i := 0; i < len(val); i++ {\n\t\t\tif val[i] == ' ' || val[i] == ',' {\n\t\t\t\tsep = i\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t\tif sep < 0 {\n\t\t\tresult = append(result, parseLength(val))\n\t\t\tbreak\n\t\t}\n\t\tpart := strings.TrimSpace(val[:sep])\n\t\tif part != \"\" {\n\t\t\tresult = append(result, parseLength(part))\n\t\t}\n\t\tval = val[sep+1:]\n\t}\n\n\treturn result\n}\n\n// isNumber проверяет, является ли строка валидным числом.\nfunc isNumber(s string) bool {\n\t_, err := strconv.ParseFloat(s, 64)\n\treturn err == nil\n}\n\n// hexToInt парсит HEX-строку в целое число.\nfunc hexToInt(s string) int {\n\ti := 0\n\tfor _, c := range s {\n\t\tif c >= '0' && c <= '9' {\n\t\t\ti = i*16 + int(c - '0')\n\t\t} else if c >= 'a' && c <= 'f' {\n\t\t\ti = i*16 + int(c - 'a' + 10)\n\t\t} else if c >= 'A' && c <= 'F' {\n\t\t\ti = i*16 + int(c - 'A' + 10)\n\t\t}\n\t}\n\treturn i\n}\n\n// ComputedStyle holds all computed CSS properties for a node.\ntype ComputedStyle struct {\n\tDisplay        DisplayType\n\tPosition       PositionType\n\tOverflow       OverflowType\n\tWidth          Length\n\tHeight         Length\n\tMinWidth       Length\n\tMaxWidth       Length\n\tTop            Length\n\tLeft           Length\n\tRight          Length\n\tBottom         Length\n\tMargin         BoxModel\n\tPadding        BoxModel\n\tBorderTop      Border\n\tBorderRight    Border\n\tBorderBottom   Border\n\tBorderLeft     Border\n\tBackgroundColor Color\n\tColor          Color\n\tZIndex         int\n\tFlexDirection  FlexDirection\n\tJustifyContent JustifyContent\n\tAlignItems     AlignItems\n\tFlexGrow       float64\n\tFlexShrink     float64\n\tGridTemplateColumns []Length\n\tGridTemplateRows    []Length\n\tGap                 Length\n\tBorderRadiusTopLeft     Length\n\tBorderRadiusTopRight    Length\n\tBorderRadiusBottomRight Length\n\tBorderRadiusBottomLeft  Length\n}\n\n// Default returns the default computed style.\nfunc Default() ComputedStyle {\n\treturn ComputedStyle{\n\t\tDisplay:         DisplayBlock,\n\t\tPosition:        PositionStatic,\n\t\tOverflow:        OverflowVisible,\n\t\tWidth:           Auto(),\n\t\tHeight:          Auto(),\n\t\tBackgroundColor: Transparent(),\n\t\tColor:           RGB(30, 30, 30),\n\t\tFlexDirection:   FlexDirectionRow,\n\t\tJustifyContent:  JustifyFlexStart,\n\t\tAlig function openView(title, nodes, edges) {

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
function textWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

function wrapText(text, maxW, font) {
  const words = (text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (textWidth(test, font) <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [text || ""];
}

function nodeMetrics(n) {
  const s = styleOf(n);
  const labelFont = "500 11px system-ui, sans-serif";
  const summaryFont = "9px system-ui, sans-serif";
  const maxTextW = n.kind === "decision" ? 200 : 220;
  const labelLines = wrapText(n.label, maxTextW, labelFont);
  const summaryLines = n.summary ? wrapText(n.summary, maxTextW, summaryFont) : [];
  const labelW = Math.max(...labelLines.map(l => textWidth(l, labelFont)), 0);
  const summaryW = Math.max(...summaryLines.map(l => textWidth(l, summaryFont)), 0);
  const hasIcon = true;
  const innerW = Math.max(labelW, summaryW) + (hasIcon ? 32 : 0);
  const minW = n.kind === "decision" ? 168 : 140;
  const maxW = n.kind === "decision" ? 280 : 300;
  const width = Math.max(minW, Math.min(maxW, innerW + 24));
  const lineH = 13;
  const labelH = 11 + (labelLines.length - 1) * lineH;
  const summaryH = summaryLines.length ? 4 + summaryLines.length * lineH : 0;
  const height = 22 + labelH + summaryH;
  return { width, height, labelLines, summaryLines, labelH, summaryH, hasIcon, color: s.color, icon: s.icon };
}

function sequentialize(arcs, visible, level) {
  if (level !== "file" && level !== "function") return arcs;
  const lineOf = id => {
    const n = visible.find(x => x.id === id);
    return n && n.source ? n.source.start_line : 0;
  };
  const out = {};
  arcs.forEach(a => { (out[a.from] = out[a.from] || []).push(a); });
  const keep = new Set();
  const add = [];
  Object.keys(out).forEach(src => {
    const srcNode = visible.find(x => x.id === src);
    if (!srcNode || srcNode.kind === "decision") return;
    const outs = out[src]
      .filter(a => visible.find(x => x.id === a.to))
      .slice()
      .sort((a, b) => lineOf(a.to) - lineOf(b.to));
    if (outs.length < 2) return;
    keep.add(`${outs[0].from}→${outs[0].to}`);
    for (let i = 1; i < outs.length; i++) {
      add.push({ from: outs[i - 1].to, to: outs[i].to, label: outs[i].label });
    }
  });
  return arcs.filter(a => {
    const srcNode = visible.find(x => x.id === a.from);
    if (srcNode && srcNode.kind === "decision") return true;
    if (!out[a.from] || out[a.from].length < 2) return true;
    return keep.has(`${a.from}→${a.to}`);
  }).concat(add);
}

function layeredLayout(nodes, edges) {
  const visible = nodes.filter(n => activeLayers.has(n.layer));
  const ids = new Set(visible.map(n => n.id));
  let arcs = edges.filter(e => ids.has(e.from) && ids.has(e.to)).map(e => ({ ...e }));
  visible.forEach(n => {
    if (n.kind === "decision" && n.branches) {
      n.branches.forEach(b => {
        if (ids.has(b.target)) arcs.push({ from: n.id, to: b.target, label: b.condition });
      });
    }
  });
  arcs = sequentialize(arcs, visible, viz.level);

  const layer = {};
  visible.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < visible.length; i++) {
    arcs.forEach(a => { if (layer[a.to] <= layer[a.from]) layer[a.to] = layer[a.from] + 1; });
  }

  const metrics = {};
  visible.forEach(n => metrics[n.id] = nodeMetrics(n));

  const groups = new Map();
  visible.forEach(n => {
    const l = layer[n.id];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(n);
  });

  const preds = {};
  arcs.forEach(a => { (preds[a.to] = preds[a.to] || []).push(a.from); });

  const sortedLayers = [...groups.keys()].sort((a, b) => a - b);
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    group.forEach(n => {
      const ps = (preds[n.id] || []).filter(p => metrics[p]._pos);
      n._bary = ps.length ? ps.reduce((s, p) => s + metrics[p]._pos.x + metrics[p].width / 2, 0) / ps.length : Infinity;
    });
    group.sort((a, b) => (a._bary - b._bary) || a.id.localeCompare(b.id));
    let x = 40;
    group.forEach(n => {
      metrics[n.id]._pos = { x, y: 0 };
      x += metrics[n.id].width + 40;
    });
  });

  let maxLayerWidth = 0;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const last = group[group.length - 1];
    const w = metrics[last.id]._pos.x + metrics[last.id].width;
    if (w > maxLayerWidth) maxLayerWidth = w;
  });

  let y = 40;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const maxH = Math.max(...group.map(n => metrics[n.id].height));
    group.forEach(n => { metrics[n.id]._pos.y = y + (maxH - metrics[n.id].height) / 2; });
    const layerW = Math.max(...group.map(n => metrics[n.id]._pos.x + metrics[n.id].width));
    const offset = (maxLayerWidth - layerW) / 2;
    group.forEach(n => { metrics[n.id]._pos.x += Math.max(0, offset); });
    y += maxH + 70;
  });

  return { visible, arcs, metrics };
}

function treeLayout(nodes, sourceEdges) {
  const root = nodes[0];
  if (!root) return { visible: [], arcs: [], metrics: {}, regions: [], header: null };

  const parentById = {};
  function index(node, parentId = null) {
    if (parentId) parentById[node.id] = parentId;
    (node.children || []).forEach(child => index(child, node.id));
  }
  index(root);

  const isFileRoot = root.kind === "group" && !root.symbol && root.id.startsWith("file:");
  const header = isFileRoot
    ? {
        label: (root.label || root.source?.file || root.id).trim(),
        summary: (root.summary || "").trim()
      }
    : null;

  function filter(node) {
    const children = collapsedNodes.has(node.id)
      ? []
      : (node.children || [])
        .filter(c => activeLayers.has(c.layer))
        .map(filter);
    return { node, children };
  }
  const tree = isFileRoot
    ? { node: null, depth: 0, children: (root.children || []).filter(c => activeLayers.has(c.layer)).map(filter) }
    : filter(root);
  const flat = [];

  function collect(t, depth) {
    t.depth = depth;
    if (t.node) flat.push(t.node);
    t.children.forEach(child => collect(child, depth + 1));
  }
  collect(tree, 0);
  const visibleIds = new Set(flat.map(node => node.id));

  const metrics = {};
  let y = 40;
  flat.forEach(node => {
    const metric = nodeMetrics(node);
    const depth = findTreeDepth(tree, node.id);
    metric._pos = { x: 40 + depth * TREE_INDENT, y };
    node._metrics = metric;
    metrics[node.id] = metric;
    y += metric.height + TREE_GAP_Y;
  });

  const regions = [];
  function bounds(t) {
    if (!t.node) {
      let aggregate = null;
      t.children.forEach(child => {
        const childBounds = bounds(child);
        if (!aggregate) aggregate = childBounds;
        else {
          aggregate.left = Math.min(aggregate.left, childBounds.left);
          aggregate.top = Math.min(aggregate.top, childBounds.top);
          aggregate.right = Math.max(aggregate.right, childBounds.right);
          aggregate.bottom = Math.max(aggregate.bottom, childBounds.bottom);
          aggregate.nodeIds = aggregate.nodeIds.concat(childBounds.nodeIds);
        }
      });
      return aggregate || { left: 0, top: 0, right: 0, bottom: 0, nodeIds: [] };
    }

    const metric = metrics[t.node.id];
    const pos = metric._pos;
    let left = pos.x - TREE_REGION_PADDING;
    let top = pos.y - TREE_REGION_PADDING;
    let right = pos.x + metric.width + TREE_REGION_PADDING;
    let bottom = pos.y + metric.height + TREE_REGION_PADDING;
    let nodeIds = [t.node.id];

    t.children.forEach(child => {
      const childBounds = bounds(child);
      left = Math.min(left, childBounds.left - TREE_REGION_NESTING_GAP);
      top = Math.min(top, childBounds.top - TREE_REGION_NESTING_GAP);
      right = Math.max(right, childBounds.right + TREE_REGION_NESTING_GAP);
      bottom = Math.max(bottom, childBounds.bottom + TREE_REGION_NESTING_GAP);
      nodeIds = nodeIds.concat(childBounds.nodeIds);
    });

    if (t.children.length) {
      regions.push({
        id: t.node.id,
        depth: t.depth,
        x: left,
        y: top,
        width: right - left,
        height: bottom - top,
        color: metric.color,
        nodeIds
      });
    }
    return { left, top, right, bottom, nodeIds };
  }
  bounds(tree);
  regions.sort((a, b) => a.depth - b.depth);

  const edges = [];
  function addStructuralEdges(t) {
    t.children.forEach(child => {
      if (t.node) edges.push({ from: t.node.id, to: child.node.id, label: null, status: null });
      addStructuralEdges(child);
    });
  }
  addStructuralEdges(tree);

  function visibleAncestor(id) {
    let currentId = id;
    while (currentId && !visibleIds.has(currentId)) {
      const parentId = parentById[currentId];
      if (!parentId) return null;
      currentId = parentId;
    }
    return currentId || null;
  }
  const seen = new Set(edges.map(edge => `${edge.from}→${edge.to}`));
  (sourceEdges || []).forEach(edge => {
    const from = visibleAncestor(edge.from);
    const to = visibleAncestor(edge.to);
    if (!from || !to || from === to) return;
    const key = `${from}→${to}`;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from, to, label: edge.label, status: edge.status });
  });

  return { visible: flat, arcs: edges, metrics, regions, header };
}

function findTreeDepth(tree, nodeId) {
  if (tree.node && tree.node.id === nodeId) return tree.depth;
  for (const child of tree.children) {
    const depth = findTreeDepth(child, nodeId);
    if (depth >= 0) return depth;
  }
  return -1;
}

function isTreeView(view) {
  return view.nodes.length === 1 && view.nodes[0].children && view.nodes[0].children.length > 0;
}

const NS = "http://www.w3.org/2000/svg";
const TREE_INDENT = 44;
const TREE_REGION_PADDING = 18;
const TREE_REGION_NESTING_GAP = 10;
const TREE_GAP_Y = 28;
const collapsedNodes = new Set();
let query = "";

function render() {
  const view = current();
  document.getElementById("crumb").textContent = view.title;
  document.getElementById("back").disabled = cursor === 0;
  document.getElementById("fwd").disabled = cursor === views.length - 1;

  const isTree = isTreeView(view);
  const layout = isTree
    ? treeLayout(view.nodes, view.edges)
    : layeredLayout(view.nodes, view.edges);
  const { visible, arcs, metrics, regions = [], header = null } = layout;
  const fileDescription = document.getElementById("file-description");
  const fileLabel = document.getElementById("file-label");
  const fileSummary = document.getElementById("file-summary");
  fileLabel.textContent = header ? header.label : "";
  fileSummary.textContent = header ? header.summary : "";
  fileSummary.style.display = header && header.summary ? "inline" : "none";
  fileDescription.style.display = header ? "block" : "none";
  const barHeight = document.getElementById("bar").getBoundingClientRect().height;
  document.getElementById("stage").style.top = `${barHeight}px`;
  document.getElementById("sidebar").style.top = `${barHeight}px`;

  const svg = document.getElementById("svg");
  svg.innerHTML = "";
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  visible.forEach(n => {
    const m = metrics[n.id];
    minX = Math.min(minX, m._pos.x);
    minY = Math.min(minY, m._pos.y);
    maxX = Math.max(maxX, m._pos.x + m.width);
    maxY = Math.max(maxY, m._pos.y + m.height);
  });
  regions.forEach(region => {
    minX = Math.min(minX, region.x);
    minY = Math.min(minY, region.y);
    maxX = Math.max(maxX, region.x + region.width);
    maxY = Math.max(maxY, region.y + region.height);
  });
  const stageWidth = visible.length ? Math.max(maxX + 40, 1) : 1;
  const stageHeight = visible.length ? Math.max(maxY + 40, 1) : 1;
  svg.setAttribute("width", stageWidth);
  svg.setAttribute("height", stageHeight);
  svg.setAttribute("viewBox", `0 0 ${stageWidth} ${stageHeight}`);

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker>';
  svg.appendChild(defs);
  const scene = document.createElementNS(NS, "g");
  scene.setAttribute("id", "scene");
  svg.appendChild(scene);

  const matches = q => n => q && (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
  const isHit = matches(query);

  const regionLayer = document.createElementNS(NS, "g");
  regionLayer.setAttribute("id", "scope-regions");
  regions.forEach(region => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "scope-region");
    if (query && !region.nodeIds.some(id => isHit(visible.find(n => n.id === id)))) group.classList.add("dim");
    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("x", region.x);
    rect.setAttribute("y", region.y);
    rect.setAttribute("width", region.width);
    rect.setAttribute("height", region.height);
    rect.setAttribute("rx", 16);
    rect.setAttribute("fill", region.color);
    rect.setAttribute("fill-opacity", "0.055");
    rect.setAttribute("stroke", region.color);
    rect.setAttribute("stroke-opacity", "0.42");
    group.appendChild(rect);
    regionLayer.appendChild(group);
  });
  scene.appendChild(regionLayer);

  arcs.forEach(a => {
    const m1 = metrics[a.from], m2 = metrics[a.to];
    const p1 = m1._pos, p2 = m2._pos;
    const sx = p1.x + m1.width / 2;
    const sy = p1.y + m1.height;
    const tx = p2.x + m2.width / 2;
    const ty = p2.y;
    const dy = Math.max(ty - sy, 30);
    const c1y = sy + dy * 0.45;
    const c2y = ty - dy * 0.45;
    const d = `M ${sx} ${sy} C ${sx} ${c1y}, ${tx} ${c2y}, ${tx} ${ty}`;

    const line = document.createElementNS(NS, "path");
    line.setAttribute("d", d);
    const status = a.status || view.edges.find(e => e.from === a.from && e.to === a.to);
    const inferred = status === "inferred" || (status && status.status === "inferred");
    line.setAttribute("class", "edge" + (inferred ? " inferred" : ""));
    line.setAttribute("marker-end", "url(#arr)");
    if (query && !(isHit(visible.find(n => n.id === a.from)) && isHit(visible.find(n => n.id === a.to)))) line.classList.add("dim");
    scene.appendChild(line);

    if (a.label) {
      const len = line.getTotalLength();
      const pt = line.getPointAtLength(len / 2);
      const lw = textWidth(a.label, "10px system-ui, sans-serif") + 12;
      const bg = document.createElementNS(NS, "rect");
      bg.setAttribute("class", "elabel-bg");
      bg.setAttribute("x", pt.x - lw / 2);
      bg.setAttribute("y", pt.y - 10);
      bg.setAttribute("width", lw);
      bg.setAttribute("height", 20);
      bg.setAttribute("rx", 6);
      scene.appendChild(bg);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "elabel");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", pt.y + 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = a.label;
      scene.appendChild(t);
    }
  });

  visible.forEach(n => {
    const p = metrics[n.id]._pos;
    const m = metrics[n.id];
    const s = styleOf(n);
    const g = document.createElementNS(NS, "g");
    const classes = ["node", n.kind];
    if (n.id === view.nodes[0]?.id) classes.push("root");
    if (query && !isHit(n)) classes.push("dim");
    g.setAttribute("class", classes.join(" "));
    const shape = document.createElementNS(NS, "rect");
    shape.setAttribute("x", p.x); shape.setAttribute("y", p.y);
    shape.setAttribute("width", m.width); shape.setAttribute("height", m.height);
    shape.setAttribute("rx", 12);
    const fill = n.kind === "group"
      ? "#181b2b"
      : n.kind === "decision"
        ? "#241d0c"
        : n.kind === "loop"
          ? "#1c1f2e"
          : "#14171f";
    shape.setAttribute("fill", fill);
    shape.setAttribute("stroke", s.color);
    shape.setAttribute("stroke-opacity", n.kind === "group" ? "0.95" : "0.78");
    shape.setAttribute("stroke-width", n.id === view.nodes[0]?.id ? 2.5 : 1.8);
    if (query && isHit(n)) shape.setAttribute("class", "hit");
    g.appendChild(shape);

    if ((n.kind === "group" || n.kind === "function") && n.children && n.children.length) {
      const toggle = document.createElementNS(NS, "g");
      toggle.setAttribute("class", "collapse-toggle");
      toggle.setAttribute("role", "button");
      toggle.setAttribute("aria-label", collapsedNodes.has(n.id) ? "Развернуть" : "Свернуть");
      toggle.addEventListener("click", event => {
        event.stopPropagation();
        collapsedNodes.has(n.id) ? collapsedNodes.delete(n.id) : collapsedNodes.add(n.id);
        render();
      });
      const toggleShape = document.createElementNS(NS, "rect");
      toggleShape.setAttribute("x", p.x + m.width - 24);
      toggleShape.setAttribute("y", p.y + 6);
      toggleShape.setAttribute("width", 16);
      toggleShape.setAttribute("height", 16);
      toggleShape.setAttribute("rx", 5);
      toggleShape.setAttribute("fill", "#252a3d");
      toggleShape.setAttribute("stroke", s.color);
      toggleShape.setAttribute("stroke-opacity", "0.55");
      toggle.appendChild(toggleShape);
      const toggleLabel = document.createElementNS(NS, "text");
      toggleLabel.setAttribute("x", p.x + m.width - 16);
      toggleLabel.setAttribute("y", p.y + 18);
      toggleLabel.setAttribute("text-anchor", "middle");
      toggleLabel.setAttribute("fill", "#cbd0ff");
      toggleLabel.setAttribute("font-size", "13");
      toggleLabel.textContent = collapsedNodes.has(n.id) ? "+" : "−";
      toggle.appendChild(toggleLabel);
      g.appendChild(toggle);
    }

    if (m.hasIcon) {
      const icon = document.createElementNS(NS, "g");
      icon.setAttribute("transform", `translate(${p.x + 18} ${p.y + m.height/2 - 7}) scale(.55)`);
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", s.color);
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.innerHTML = ICON_PATHS[s.icon] || ICON_PATHS.Box;
      g.appendChild(icon);
    }

    const textX = m.hasIcon ? p.x + 38 : p.x + 12;
    const labelMaxW = m.width - (m.hasIcon ? 48 : 22);
    const labelLines = wrapText(n.label, labelMaxW, "500 11px system-ui, sans-serif");
    labelLines.forEach((ln, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "nlabel");
      t.setAttribute("x", textX);
      t.setAttribute("y", p.y + 17 + i * 13);
      t.textContent = ln;
      g.appendChild(t);
    });

    if (n.summary) {
      const summaryLines = wrapText(n.summary, labelMaxW, "9px system-ui, sans-serif");
      summaryLines.forEach((ln, i) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("class", "nsummary");
        t.setAttribute("x", textX);
        t.setAttribute("y", p.y + 19 + labelLines.length * 13 + 4 + i * 13);
        t.textContent = ln;
        g.appendChild(t);
      });
    }

    if (n.tests) {
      ["unit", "integration", "e2e"].forEach((k, i) => {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", p.x + m.width - 12 - i * 10); dot.setAttribute("cy", p.y + 11);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", n.tests[k] ? ["#34d399", "#60a5fa", "#f472b6"][i] : "#3f3f46");
        g.appendChild(dot);
      });
    }

    g.addEventListener("click", event => {
      if (event.metaKey) {
        if (n.children && n.children.length) {
          document.getElementById("sidebar").style.display = "none";
          openView(n.label, n.children, []);
        } else if (n.symbol) {
          document.getElementById("sidebar").style.display = "none";
          window.parent.postMessage({ type: "graphloom:navigate", symbolId: n.symbol }, "*");
        }
        return;
      }
      showSidebar(n);
    });
    scene.appendChild(g);
  });
}

function showSidebar(n) {
  const s = styleOf(n);
  document.getElementById("s-title").textContent = n.label;
  document.getElementById("s-meta").textContent =
    s.icon + " " + n.kind + (n.element_type ? " · " + n.element_type : "") +
    (n.confidence != null ? " · confidence " + n.confidence.toFixed(2) : "");
  document.getElementById("s-tests").innerHTML = n.tests
    ? ["unit", "integration", "e2e"].map(k =>
        '<span class="chip ' + (n.tests[k] ? "on" : "off") + '">' + k + "</span>").join("")
    : "";
  document.getElementById("s-summary").textContent = n.summary || "";

  const extra = document.getElementById("s-extra");
  extra.innerHTML = "";

  const refs = document.getElementById("s-refs");
  refs.innerHTML = "";
  if (n.cross_refs && n.cross_refs.length) {
    const title = document.createElement("div");
    title.className = "meta";
    title.textContent = "Связи:";
    refs.appendChild(title);
    const list = document.createElement("div");
    for (const ref of n.cross_refs) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = ref.label;
      a.style.display = "block";
      a.style.color = "#60a5fa";
      a.style.marginTop = "4px";
      a.style.textDecoration = "none";
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: ref.id, file: ref.file }, "*");
      });
      list.appendChild(a);
    }
    refs.appendChild(list);
  }

  if (n.kind === "call" && n.children && n.children.length) {
    const btn = document.createElement("button");
    btn.className = "expand";
    btn.textContent = "Раскрыть flow";
    btn.addEventListener("click", () => {
      document.getElementById("sidebar").style.display = "none";
      openView(n.label, n.children, []);
    });
    extra.appendChild(btn);
  }

  const code = document.getElementById("s-code");
  if (n.source && sources[n.source.file]) {
    const lines = sources[n.source.file].split("\n");
    const from = Math.max(1, n.source.start_line - 2);
    const to = Math.min(lines.length, n.source.end_line + 2);
    let html = "";
    for (let i = from; i <= to; i++) {
      const esc = lines[i - 1].replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const body = '<span class="ln">' + i + "</span>" + esc;
      html += i >= n.source.start_line && i <= n.source.end_line
        ? '<span class="hl">' + body + "</span>" : body + "\n";
    }
    code.innerHTML = html;
    code.style.display = "block";
  } else {
    code.style.display = "none";
  }
  document.getElementById("sidebar").style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("sidebar").style.display = "none";
});
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
</html>
