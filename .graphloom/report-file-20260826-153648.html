<title>Graphloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #09090b; color: #e4e4e7; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; min-height: 42px; padding: 6px 12px; background: rgba(9,9,11,.94);
         border-bottom: 1px solid #27272a; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #bar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  #bar .crumb { min-width: 0; flex: 1; font-size: 12px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers { display: flex; flex: 0 0 auto; gap: 7px; align-items: center; }
  .lchk { font-size: 11px; color: #a1a1aa; display: flex; gap: 3px; align-items: center; cursor: pointer; white-space: nowrap; }
  #search { flex: 0 0 150px; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; color: #e4e4e7;
            padding: 4px 8px; font-size: 12px; width: 150px; }
  .nav { background: #27272a; border: none; color: #e4e4e7; border-radius: 6px; padding: 4px 9px;
         cursor: pointer; font-size: 12px; }
  .nav:disabled { opacity: .4; cursor: default; }
  #stage { position: fixed; inset: 0; top: 42px; overflow: auto; padding: 24px 0 40px; }
  svg { display: block; }
  .node { cursor: pointer; }
  .node rect, .node polygon { transition: filter .15s; }
  .node:hover rect, .node:hover polygon { filter: brightness(1.25); }
  .node.dim, .edge.dim { opacity: .12; }
  .edge { stroke: #52525b; stroke-width: 1.5; fill: none; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .elabel-bg { fill: #09090b; stroke: #27272a; stroke-width: 1; }
  .elabel { font-size: 10px; fill: #a1a1aa; }
  .nlabel { font-size: 12px; fill: #f4f4f5; font-weight: 500; }
  .nsummary { font-size: 10px; fill: #71717a; }
  .nkind { font-size: 11px; }
  .hit { stroke: #facc15; stroke-width: 2.5; }
  #sidebar { position: fixed; top: 42px; right: 0; bottom: 0; width: 380px; background: #18181b;
             border-left: 1px solid #27272a; padding: 16px; overflow: auto; display: none; z-index: 6; }
  #sidebar h2 { font-size: 16px; margin-bottom: 2px; padding-right: 20px; }
  #sidebar .meta { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  #close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #71717a;
           background: none; border: none; font-size: 16px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
  .chip.on { background: #064e3b; color: #6ee7b7; }
  .chip.off { background: #27272a; color: #71717a; }
  pre.code { margin-top: 12px; background: #09090b; border: 1px solid #27272a; border-radius: 8px;
             padding: 10px; font: 11px/1.6 ui-monospace, monospace; overflow: auto; }
  pre.code .ln { color: #52525b; display: inline-block; width: 34px; user-select: none; }
  pre.code .hl { background: #27272a; display: block; }
  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;
            padding: 5px 12px; cursor: pointer; font-size: 12px; }
</style>

const sources = {"internal/css/computed.go":"// Computed style computation: cascade, specificity, and value parsing.\npackage css\n\nimport (\n\t\"strconv\"\n\t\"strings\"\n\t\"sync\"\n\n\t\"github.com/starframe/abyss/internal/dom\"\n)\n\n// cached is a global cache of computed styles keyed by document.\nvar cached struct {\n\tsync.Mutex\n\tdoc    *dom.Node\n\tstyles map[*dom.Node]ComputedStyle\n}\n\n// Compute computes computed styles for all nodes in the document.\n// Results are cached and reused if the document hasn't changed.\nfunc Compute(doc *dom.Node) map[*dom.Node]ComputedStyle {\n\treturn computeWithExtra(doc, nil)\n}\n\n// ComputeWithExternal computes styles with additional external CSS strings.\nfunc ComputeWithExternal(doc *dom.Node, externalCSS []string) map[*dom.Node]ComputedStyle {\n\treturn computeWithExtra(doc, externalCSS)\n}\n\nfunc computeWithExtra(doc *dom.Node, externalCSS []string) map[*dom.Node]ComputedStyle {\n\tcached.Lock()\n\tdefer cached.Unlock()\n\n\t// Return cached result if document is the same and no external CSS\n\tif cached.doc == doc && cached.styles != nil && len(externalCSS) == 0 {\n\t\treturn cached.styles\n\t}\n\n\tstyles := make(map[*dom.Node]ComputedStyle)\n\n\t// Collect all rules from <style> tags\n\tvar allRules []Rule\n\tfor _, styleNode := range doc.FindStyleTags() {\n\t\tcssText := styleNode.TextContent()\n\t\trules := ParseStyleSheet(cssText)\n\t\tallRules = append(allRules, rules...)\n\t}\n\n\t// Add rules from external CSS\n\tfor _, cssText := range externalCSS {\n\t\trules := ParseStyleSheet(cssText)\n\t\tallRules = append(allRules, rules...)\n\t}\n\n\t// Compute styles recursively\n\tcomputeNode(doc, allRules, styles)\n\n\t// Cache for next call\n\tcached.doc = doc\n\tcached.styles = styles\n\n\treturn styles\n}\n\n// InvalidateCache clears the computed style cache.\n// Should be called when DOM is modified via JS.\nfunc InvalidateCache() {\n\tcached.Lock()\n\tdefer cached.Unlock()\n\tcached.doc = nil\n\tcached.styles = nil\n}\n\nfunc computeNode(node *dom.Node, rules []Rule, styles map[*dom.Node]ComputedStyle) {\n\tstyle := Default()\n\n\t// Apply matching rules from stylesheet (sorted by specificity)\n\ttype match struct {\n\t\tdecls       []Declaration\n\t\tspecificity int\n\t}\n\tvar matches []match\n\n\tfor _, rule := range rules {\n\t\tfor _, sel := range rule.Selectors {\n\t\t\tif nodeMatchesSelector(node, sel) {\n\t\t\t\tmatches = append(matches, match{\n\t\t\t\t\tdecls:       rule.Declarations,\n\t\t\t\t\tspecificity: Specificity(sel),\n\t\t\t\t})\n\t\t\t}\n\t\t}\n\t}\n\n\t// Sort by specificity (lower first, so higher override)\n\tfor i := 0; i < len(matches)-1; i++ {\n\t\tfor j := i + 1; j < len(matches); j++ {\n\t\t\tif matches[i].specificity > matches[j].specificity {\n\t\t\t\tmatches[i], matches[j] = matches[j], matches[i]\n\t\t\t}\n\t\t}\n\t}\n\n\t// Apply stylesheet rules\n\tfor _, m := range matches {\n\t\tfor _, decl := range m.decls {\n\t\t\tapplyDeclaration(&style, decl.Property, decl.Value)\n\t\t}\n\t}\n\n\t// Apply inline styles (highest specificity)\n\tif inline := node.GetAttr(\"style\"); inline != \"\" {\n\t\tdecls := ParseInline(inline)\n\t\tfor _, decl := range decls {\n\t\t\tapplyDeclaration(&style, decl.Property, decl.Value)\n\t\t}\n\t}\n\n\tstyles[node] = style\n\n\t// Recurse to children\n\tfor _, child := range node.Children {\n\t\tcomputeNode(child, rules, styles)\n\t}\n}\n\nfunc nodeMatchesSelector(node *dom.Node, selector string) bool {\n\tif node.Type != dom.ElementNode {\n\t\treturn false\n\t}\n\n\t// Handle simple combinators: \"parent > child\"\n\tif strings.Contains(selector, \">\") {\n\t\tparts := strings.SplitN(selector, \">\", 2)\n\t\tparentSel := strings.TrimSpace(parts[0])\n\t\tchildSel := strings.TrimSpace(parts[1])\n\t\tif node.Parent == nil || !node.Parent.Matches(parentSel) {\n\t\t\treturn false\n\t\t}\n\t\treturn node.Matches(childSel)\n\t}\n\n\t// Handle descendant: \"ancestor descendant\"\n\ttokens := tokenizeSelector(selector)\n\tif len(tokens) == 1 {\n\t\treturn node.Matches(selector)\n\t}\n\n\t// For compound selectors like \"div.container\", check all parts\n\t// Simple check: does the node match the last token?\n\tlastToken := tokens[len(tokens)-1]\n\tif lastToken == \">\" || lastToken == \"+\" || lastToken == \"~\" {\n\t\treturn false\n\t}\n\treturn node.Matches(lastToken)\n}\n\nfunc applyDeclaration(style *ComputedStyle, prop, val string) {\n\tprop = strings.ToLower(strings.TrimSpace(prop))\n\tval = strings.TrimSpace(val)\n\n\tswitch prop {\n\tcase \"display\":\n\t\tstyle.Display = parseDisplay(val)\n\tcase \"position\":\n\t\tstyle.Position = parsePosition(val)\n\tcase \"overflow\":\n\t\tstyle.Overflow = parseOverflow(val)\n\tcase \"width\":\n\t\tstyle.Width = parseLength(val)\n\tcase \"height\":\n\t\tstyle.Height = parseLength(val)\n\tcase \"min-width\":\n\t\tstyle.MinWidth = parseLength(val)\n\tcase \"max-width\":\n\t\tstyle.MaxWidth = parseLength(val)\n\tcase \"top\":\n\t\tstyle.Top = parseLength(val)\n\tcase \"left\":\n\t\tstyle.Left = parseLength(val)\n\tcase \"right\":\n\t\tstyle.Right = parseLength(val)\n\tcase \"bottom\":\n\t\tstyle.Bottom = parseLength(val)\n\tcase \"margin\":\n\t\tstyle.Margin = parseBoxModel(val)\n\tcase \"margin-top\":\n\t\tstyle.Margin.Top = parseLength(val)\n\tcase \"margin-right\":\n\t\tstyle.Margin.Right = parseLength(val)\n\tcase \"margin-bottom\":\n\t\tstyle.Margin.Bottom = parseLength(val)\n\tcase \"margin-left\":\n\t\tstyle.Margin.Left = parseLength(val)\n\tcase \"padding\":\n\t\tstyle.Padding = parseBoxModel(val)\n\tcase \"padding-top\":\n\t\tstyle.Padding.Top = parseLength(val)\n\tcase \"padding-right\":\n\t\tstyle.Padding.Right = parseLength(val)\n\tcase \"padding-bottom\":\n\t\tstyle.Padding.Bottom = parseLength(val)\n\tcase \"padding-left\":\n\t\tstyle.Padding.Left = parseLength(val)\n\tcase \"border\":\n\t\tb := parseBorder(val)\n\t\tstyle.BorderTop = b\n\t\tstyle.BorderRight = b\n\t\tstyle.BorderBottom = b\n\t\tstyle.BorderLeft = b\n\tcase \"border-top\":\n\t\tstyle.BorderTop = parseBorder(val)\n\tcase \"border-right\":\n\t\tstyle.BorderRight = parseBorder(val)\n\tcase \"border-bottom\":\n\t\tstyle.BorderBottom = parseBorder(val)\n\tcase \"border-left\":\n\t\tstyle.BorderLeft = parseBorder(val)\n\tcase \"border-width\":\n\t\tw := parseBorderWidth(val)\n\t\tstyle.BorderTop.Width = w\n\t\tstyle.BorderRight.Width = w\n\t\tstyle.BorderBottom.Width = w\n\t\tstyle.BorderLeft.Width = w\n\tcase \"border-color\":\n\t\tc := parseColor(val)\n\t\tstyle.BorderTop.Color = c\n\t\tstyle.BorderRight.Color = c\n\t\tstyle.BorderBottom.Color = c\n\t\tstyle.BorderLeft.Color = c\n\tcase \"border-style\":\n\t\ts := parseBorderStyle(val)\n\t\tstyle.BorderTop.Style = s\n\t\tstyle.BorderRight.Style = s\n\t\tstyle.BorderBottom.Style = s\n\t\tstyle.BorderLeft.Style = s\n\tcase \"background-color\":\n\t\tstyle.BackgroundColor = parseColor(val)\n\tcase \"color\":\n\t\tstyle.Color = parseColor(val)\n\tcase \"z-index\":\n\t\tstyle.ZIndex = parseInt(val)\n\tcase \"flex-direction\":\n\t\tstyle.FlexDirection = parseFlexDirection(val)\n\tcase \"justify-content\":\n\t\tstyle.JustifyContent = parseJustifyContent(val)\n\tcase \"align-items\":\n\t\tstyle.AlignItems = parseAlignItems(val)\n\tcase \"flex-grow\":\n\t\tstyle.FlexGrow = parseFloat(val)\n\tcase \"flex-shrink\":\n\t\tstyle.FlexShrink = parseFloat(val)\n\tcase \"gap\":\n\t\tstyle.Gap = parseLength(val)\n\tcase \"grid-template-columns\":\n\t\tstyle.GridTemplateColumns = parseLengthList(val)\n\tcase \"grid-template-rows\":\n\t\tstyle.GridTemplateRows = parseLengthList(val)\n\tcase \"border-radius\":\n\t\tr := parseLength(val)\n\t\tstyle.BorderRadiusTopLeft = r\n\t\tstyle.BorderRadiusTopRight = r\n\t\tstyle.BorderRadiusBottomRight = r\n\t\tstyle.BorderRadiusBottomLeft = r\n\tcase \"border-top-left-radius\":\n\t\tstyle.BorderRadiusTopLeft = parseLength(val)\n\tcase \"border-top-right-radius\":\n\t\tstyle.BorderRadiusTopRight = parseLength(val)\n\tcase \"border-bottom-right-radius\":\n\t\tstyle.BorderRadiusBottomRight = parseLength(val)\n\tcase \"border-bottom-left-radius\":\n\t\tstyle.BorderRadiusBottomLeft = parseLength(val)\n\t}\n}\n\nfunc parseDisplay(val string) DisplayType {\n\tswitch val {\n\tcase \"block\":\n\t\treturn DisplayBlock\n\tcase \"inline\":\n\t\treturn DisplayInline\n\tcase \"flex\":\n\t\treturn DisplayFlex\n\tcase \"grid\":\n\t\treturn DisplayGrid\n\tcase \"none\":\n\t\treturn DisplayNone\n\t}\n\treturn DisplayBlock\n}\n\nfunc parsePosition(val string) PositionType {\n\tswitch val {\n\tcase \"static\":\n\t\treturn PositionStatic\n\tcase \"relative\":\n\t\treturn PositionRelative\n\tcase \"absolute\":\n\t\treturn PositionAbsolute\n\t}\n\treturn PositionStatic\n}\n\nfunc parseOverflow(val string) OverflowType {\n\tswitch val {\n\tcase \"hidden\":\n\t\treturn OverflowHidden\n\tcase \"visible\":\n\t\treturn OverflowVisible\n\t}\n\treturn OverflowVisible\n}\n\nfunc parseLength(val string) Length {\n\tval = strings.TrimSpace(val)\n\tif val == \"auto\" {\n\t\treturn Auto()\n\t}\n\tif strings.HasSuffix(val, \"px\") {\n\t\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"px\"), 64)\n\t\treturn Px(v)\n\t}\n\tif strings.HasSuffix(val, \"%\") {\n\t\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"%\"), 64)\n\t\treturn Percent(v)\n\t}\n\tif strings.HasSuffix(val, \"rem\") || strings.HasSuffix(val, \"em\") {\n\t\t// Treat rem/em as px for simplicity (assuming 1rem = 16px)\n\t\tv, _ := strconv.ParseFloat(strings.TrimSuffix(strings.TrimSuffix(val, \"rem\"), \"em\"), 64)\n\t\treturn Px(v * 16)\n\t}\n\tif strings.HasSuffix(val, \"fr\") {\n\t\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"fr\"), 64)\n\t\treturn Px(v)\n\t}\n\t// Try plain number as px\n\tv, err := strconv.ParseFloat(val, 64)\n\tif err == nil {\n\t\treturn Px(v)\n\t}\n\treturn Auto()\n}\n\nfunc parseBoxModel(val string) BoxModel {\n\tparts := strings.Fields(val)\n\tswitch len(parts) {\n\tcase 1:\n\t\tl := parseLength(parts[0])\n\t\treturn BoxModel{Top: l, Right: l, Bottom: l, Left: l}\n\tcase 2:\n\t\tv := parseLength(parts[0])\n\t\th := parseLength(parts[1])\n\t\treturn BoxModel{Top: v, Right: h, Bottom: v, Left: h}\n\tcase 3:\n\t\tt := parseLength(parts[0])\n\t\th := parseLength(parts[1])\n\t\tb := parseLength(parts[2])\n\t\treturn BoxModel{Top: t, Right: h, Bottom: b, Left: h}\n\tcase 4:\n\t\treturn BoxModel{\n\t\t\tTop:    parseLength(parts[0]),\n\t\t\tRight:  parseLength(parts[1]),\n\t\t\tBottom: parseLength(parts[2]),\n\t\t\tLeft:   parseLength(parts[3]),\n\t\t}\n\t}\n\treturn BoxModel{}\n}\n\nfunc parseBorder(val string) Border {\n\tparts := strings.Fields(val)\n\tb := Border{Style: BorderNone}\n\tfor _, part := range parts {\n\t\tpart = strings.ToLower(part)\n\t\tswitch part {\n\t\tcase \"none\":\n\t\t\tb.Style = BorderNone\n\t\tcase \"solid\":\n\t\t\tb.Style = BorderSolid\n\t\tdefault:\n\t\t\tif strings.HasSuffix(part, \"px\") || isNumber(part) {\n\t\t\t\tb.Width, _ = strconv.ParseFloat(strings.TrimSuffix(part, \"px\"), 64)\n\t\t\t\tif b.Width == 0 && isNumber(part) {\n\t\t\t\t\tb.Width, _ = strconv.ParseFloat(part, 64)\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tb.Color = parseColor(part)\n\t\t\t}\n\t\t}\n\t}\n\treturn b\n}\n\nfunc parseBorderWidth(val string) float64 {\n\tv, _ := strconv.ParseFloat(strings.TrimSuffix(val, \"px\"), 64)\n\treturn v\n}\n\nfunc parseBorderStyle(val string) BorderStyle {\n\tswitch val {\n\tcase \"none\":\n\t\treturn BorderNone\n\tcase \"solid\":\n\t\treturn BorderSolid\n\t}\n\treturn BorderNone\n}\n\nfunc parseColor(val string) Color {\n\tval = strings.ToLower(strings.TrimSpace(val))\n\tswitch val {\n\tcase \"transparent\":\n\t\treturn Transparent()\n\tcase \"black\":\n\t\treturn RGB(0, 0, 0)\n\tcase \"white\":\n\t\treturn RGB(255, 255, 255)\n\tcase \"red\":\n\t\treturn RGB(255, 0, 0)\n\tcase \"green\":\n\t\treturn RGB(0, 128, 0)\n\tcase \"blue\":\n\t\treturn RGB(0, 0, 255)\n\tcase \"yellow\":\n\t\treturn RGB(255, 255, 0)\n\tcase \"cyan\":\n\t\treturn RGB(0, 255, 255)\n\tcase \"magenta\":\n\t\treturn RGB(255, 0, 255)\n\tcase \"gray\":\n\t\treturn RGB(128, 128, 128)\n\tcase \"lightgray\":\n\t\treturn RGB(211, 211, 211)\n\tcase \"darkgray\":\n\t\treturn RGB(169, 169, 169)\n\tcase \"orange\":\n\t\treturn RGB(255, 165, 0)\n\tcase \"purple\":\n\t\treturn RGB(128, 0, 128)\n\tcase \"pink\":\n\t\treturn RGB(255, 192, 203)\n\tcase \"brown\":\n\t\treturn RGB(165, 42, 42)\n\t}\n\tif strings.HasPrefix(val, \"#\") {\n\t\treturn Hex(val)\n\t}\n\tif strings.HasPrefix(val, \"rgb(\") && strings.HasSuffix(val, \")\") {\n\t\tinner := val[4 : len(val)-1]\n\t\tparts := strings.Split(inner, \",\")\n\t\tif len(parts) == 3 {\n\t\t\tr, _ := strconv.Atoi(strings.TrimSpace(parts[0]))\n\t\t\tg, _ := strconv.Atoi(strings.TrimSpace(parts[1]))\n\t\t\tb, _ := strconv.Atoi(strings.TrimSpace(parts[2]))\n\t\t\treturn RGB(uint8(r), uint8(g), uint8(b))\n\t\t}\n\t}\n\treturn Transparent()\n}\n\nfunc parseInt(val string) int {\n\tv, _ := strconv.Atoi(strings.TrimSpace(val))\n\treturn v\n}\n\nfunc parseFloat(val string) float64 {\n\tv, _ := strconv.ParseFloat(strings.TrimSpace(val), 64)\n\treturn v\n}\n\nfunc parseFlexDirection(val string) FlexDirection {\n\tswitch val {\n\tcase \"row\":\n\t\treturn FlexDirectionRow\n\tcase \"column\":\n\t\treturn FlexDirectionColumn\n\t}\n\treturn FlexDirectionRow\n}\n\nfunc parseJustifyContent(val string) JustifyContent {\n\tswitch val {\n\tcase \"flex-start\":\n\t\treturn JustifyFlexStart\n\tcase \"center\":\n\t\treturn JustifyCenter\n\tcase \"flex-end\":\n\t\treturn JustifyFlexEnd\n\tcase \"space-between\":\n\t\treturn JustifySpaceBetween\n\tcase \"space-around\":\n\t\treturn JustifySpaceAround\n\t}\n\treturn JustifyFlexStart\n}\n\nfunc parseAlignItems(val string) AlignItems {\n\tswitch val {\n\tcase \"flex-start\":\n\t\treturn AlignFlexStart\n\tcase \"center\":\n\t\treturn AlignCenter\n\tcase \"flex-end\":\n\t\treturn AlignFlexEnd\n\tcase \"stretch\":\n\t\treturn AlignStretch\n\t}\n\treturn AlignStretch\n}\n\nfunc parseLengthList(val string) []Length {\n\tvar result []Length\n\tval = strings.TrimSpace(val)\n\n\tfor len(val) > 0 {\n\t\tval = strings.TrimSpace(val)\n\t\tif val == \"\" {\n\t\t\tbreak\n\t\t}\n\n\t\t// Handle repeat() syntax: repeat(3, 1fr)\n\t\tif strings.HasPrefix(val, \"repeat(\") {\n\t\t\tend := strings.Index(val, \")\")\n\t\t\tif end < 0 {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tinner := val[7:end]\n\t\t\tcomma := strings.Index(inner, \",\")\n\t\t\tif comma > 0 {\n\t\t\t\tcount, _ := strconv.Atoi(strings.TrimSpace(inner[:comma]))\n\t\t\t\titem := strings.TrimSpace(inner[comma+1:])\n\t\t\t\tfor i := 0; i < count; i++ {\n\t\t\t\t\tresult = append(result, parseLength(item))\n\t\t\t\t}\n\t\t\t}\n\t\t\tval = val[end+1:]\n\t\t\tcontinue\n\t\t}\n\n\t\t// Find next separator (space or comma)\n\t\tsep := -1\n\t\tfor i := 0; i < len(val); i++ {\n\t\t\tif val[i] == ' ' || val[i] == ',' {\n\t\t\t\tsep = i\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t\tif sep < 0 {\n\t\t\tresult = append(result, parseLength(val))\n\t\t\tbreak\n\t\t}\n\t\tpart := strings.TrimSpace(val[:sep])\n\t\tif part != \"\" {\n\t\t\tresult = append(result, parseLength(part))\n\t\t}\n\t\tval = val[sep+1:]\n\t}\n\n\treturn result\n}\n\nfunc isNumber(s string) bool {\n\t_, err := strconv.ParseFloat(s, 64)\n\treturn err == nil\n}\n"};

const LAYERS = ["flow", "calls", "data", "state", "effects"];
const activeLayers = new Set(LAYERS);
const layersBox = document.getElementById("layers");
LAYERS.forEach(l => {
  const label = document.createElement("label");
  label.className = "lchk";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = true;
  cb.addEventListener("change", () => {
    cb.checked ? activeLayers.add(l) : activeLayers.delete(l);
    render();
  });
  label.appendChild(cb);
  label.appendChild(document.createTextNode(l));
  layersBox.appendChild(label);
});

let views = [{ title: viz.title, nodes: viz.nodes, edges: viz.edges }];
let cursor = 0;
const current = () => views[cursor];

document.getElementById("back").addEventListener("click", () => { if (cursor > 0) { cursor--; render(); } });
document.getElementById("fwd").addEventListener("click", () => { if (cursor < views.length - 1) { cursor++; render(); } });

function openView(title, nodes, edges) {
  views = views.slice(0, cursor + 1);
  views.push({ title, nodes, edges });
  cursor++;
  render();
}

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
function textWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

function wrapText(text, maxW, font) {
  const words = (text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (textWidth(test, font) <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [text || ""];
}

function nodeMetrics(n) {
  const s = styleOf(n);
  const isDecision = n.kind === "decision";
  const labelFont = "500 12px system-ui, sans-serif";
  const summaryFont = "10px system-ui, sans-serif";
  const maxTextW = isDecision ? 200 : 240;
  const labelLines = wrapText(n.label, maxTextW, labelFont);
  const summaryLines = n.summary && !isDecision ? wrapText(n.summary, maxTextW, summaryFont) : [];
  const labelW = Math.max(...labelLines.map(l => textWidth(l, labelFont)), 0);
  const summaryW = Math.max(...summaryLines.map(l => textWidth(l, summaryFont)), 0);
  const hasIcon = !isDecision;
  const innerW = Math.max(labelW, summaryW) + (hasIcon ? 40 : 0);
  const minW = isDecision ? 180 : 160;
  const maxW = isDecision ? 260 : 320;
  const width = Math.max(minW, Math.min(maxW, innerW + 32));
  const lineH = 14;
  const labelH = 12 + (labelLines.length - 1) * lineH;
  const summaryH = summaryLines.length ? 6 + summaryLines.length * lineH : 0;
  const height = 28 + labelH + summaryH;
  return { width, height, labelLines, summaryLines, labelH, summaryH, isDecision, hasIcon, color: s.color, icon: s.icon };
}

function sequentialize(arcs, visible, level) {
  if (level !== "file" && level !== "function") return arcs;
  const lineOf = id => {
    const n = visible.find(x => x.id === id);
    return n && n.source ? n.source.start_line : 0;
  };
  const out = {};
  arcs.forEach(a => { (out[a.from] = out[a.from] || []).push(a); });
  const keep = new Set();
  const add = [];
  Object.keys(out).forEach(src => {
    const srcNode = visible.find(x => x.id === src);
    if (!srcNode || srcNode.kind === "decision") return;
    const outs = out[src]
      .filter(a => visible.find(x => x.id === a.to))
      .slice()
      .sort((a, b) => lineOf(a.to) - lineOf(b.to));
    if (outs.length < 2) return;
    keep.add(`${outs[0].from}→${outs[0].to}`);
    for (let i = 1; i < outs.length; i++) {
      add.push({ from: outs[i - 1].to, to: outs[i].to, label: outs[i].label });
    }
  });
  return arcs.filter(a => {
    const srcNode = visible.find(x => x.id === a.from);
    if (srcNode && srcNode.kind === "decision") return true;
    if (!out[a.from] || out[a.from].length < 2) return true;
    return keep.has(`${a.from}→${a.to}`);
  }).concat(add);
}

function layeredLayout(nodes, edges) {
  const visible = nodes.filter(n => activeLayers.has(n.layer));
  const ids = new Set(visible.map(n => n.id));
  let arcs = edges.filter(e => ids.has(e.from) && ids.has(e.to)).map(e => ({ ...e }));
  visible.forEach(n => {
    if (n.kind === "decision" && n.branches) {
      n.branches.forEach(b => {
        if (ids.has(b.target)) arcs.push({ from: n.id, to: b.target, label: b.condition });
      });
    }
  });
  arcs = sequentialize(arcs, visible, viz.level);

  const layer = {};
  visible.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < visible.length; i++) {
    arcs.forEach(a => { if (layer[a.to] <= layer[a.from]) layer[a.to] = layer[a.from] + 1; });
  }

  const metrics = {};
  visible.forEach(n => metrics[n.id] = nodeMetrics(n));

  const groups = new Map();
  visible.forEach(n => {
    const l = layer[n.id];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(n);
  });

  const preds = {};
  arcs.forEach(a => { (preds[a.to] = preds[a.to] || []).push(a.from); });

  const sortedLayers = [...groups.keys()].sort((a, b) => a - b);
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    group.forEach(n => {
      const ps = (preds[n.id] || []).filter(p => metrics[p]._pos);
      n._bary = ps.length ? ps.reduce((s, p) => s + metrics[p]._pos.x + metrics[p].width / 2, 0) / ps.length : Infinity;
    });
    group.sort((a, b) => (a._bary - b._bary) || a.id.localeCompare(b.id));
    let x = 40;
    group.forEach(n => {
      metrics[n.id]._pos = { x, y: 0 };
      x += metrics[n.id].width + 40;
    });
  });

  let maxLayerWidth = 0;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const last = group[group.length - 1];
    const w = metrics[last.id]._pos.x + metrics[last.id].width;
    if (w > maxLayerWidth) maxLayerWidth = w;
  });

  let y = 40;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const maxH = Math.max(...group.map(n => metrics[n.id].height));
    group.forEach(n => { metrics[n.id]._pos.y = y + (maxH - metrics[n.id].height) / 2; });
    const layerW = Math.max(...group.map(n => metrics[n.id]._pos.x + metrics[n.id].width));
    const offset = (maxLayerWidth - layerW) / 2;
    group.forEach(n => { metrics[n.id]._pos.x += Math.max(0, offset); });
    y += maxH + 70;
  });

  return { visible, arcs, metrics };
}

function treeLayout(nodes) {
  const root = nodes[0];
  function filter(node) {
    const children = (node.children || []).filter(c => activeLayers.has(c.layer)).map(filter);
    return { node, children };
  }
  const tree = filter(root);

  function measure(t) {
    const m = nodeMetrics(t.node);
    t.metrics = m;
    if (t.children.length) {
      let sub = 0;
      t.children.forEach(c => {
        measure(c);
        sub += c.subW + 40;
      });
      sub -= 40;
      t.subW = Math.max(m.width, sub);
    } else {
      t.subW = m.width;
    }
  }
  measure(tree);

  function place(t, x, y) {
    const m = t.metrics;
    t.node._pos = { x: x + t.subW / 2 - m.width / 2, y };
    let cx = x;
    const childY = y + m.height + 50;
    t.children.forEach(c => {
      place(c, cx, childY);
      cx += c.subW + 40;
    });
  }
  place(tree, 40, 40);

  const flat = [];
  function collect(t) {
    flat.push(t.node);
    t.children.forEach(collect);
  }
  collect(tree);

  // compute edges: parent -> first child and sequential siblings
  const edges = [];
  function walk(t) {
    if (t.children.length) {
      edges.push({ from: t.node.id, to: t.children[0].node.id, label: null, status: null });
      for (let i = 1; i < t.children.length; i++) {
        edges.push({ from: t.children[i - 1].node.id, to: t.children[i].node.id, label: null, status: null });
      }
      t.children.forEach(walk);
    }
  }
  walk(tree);

  const metrics = {};
  flat.forEach(n => metrics[n.id] = nodeMetrics(n));
  return { visible: flat, arcs: edges, metrics };
}

function isTreeView(view) {
  return view.nodes.length === 1 && view.edges.length === 0 && view.nodes[0].children && view.nodes[0].children.length > 0;
}

const NS = "http://www.w3.org/2000/svg";
let query = "";

function render() {
  const view = current();
  document.getElementById("crumb").textContent = view.title;
  document.getElementById("back").disabled = cursor === 0;
  document.getElementById("fwd").disabled = cursor === views.length - 1;

  const isTree = isTreeView(view);
  const { visible, arcs, metrics } = isTree
    ? treeLayout(view.nodes)
    : layeredLayout(view.nodes, view.edges);

  const svg = document.getElementById("svg");
  svg.innerHTML = "";
  const stage = document.getElementById("stage");
  let maxX = 0, maxY = 0;
  visible.forEach(n => {
    const m = metrics[n.id];
    maxX = Math.max(maxX, m._pos.x + m.width + 40);
    maxY = Math.max(maxY, m._pos.y + m.height + 40);
  });
  svg.setAttribute("width", Math.max(maxX, stage.clientWidth));
  svg.setAttribute("height", Math.max(maxY, stage.clientHeight));

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/></marker>';
  svg.appendChild(defs);

  const matches = q => n => q && (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
  const isHit = matches(query);

  arcs.forEach(a => {
    const m1 = metrics[a.from], m2 = metrics[a.to];
    const p1 = m1._pos, p2 = m2._pos;
    const sx = p1.x + m1.width / 2;
    const sy = p1.y + m1.height;
    const tx = p2.x + m2.width / 2;
    const ty = p2.y;
    const dy = Math.max(ty - sy, 30);
    const c1y = sy + dy * 0.45;
    const c2y = ty - dy * 0.45;
    const d = `M ${sx} ${sy} C ${sx} ${c1y}, ${tx} ${c2y}, ${tx} ${ty}`;

    const line = document.createElementNS(NS, "path");
    line.setAttribute("d", d);
    const status = view.edges.find(e => e.from === a.from && e.to === a.to);
    line.setAttribute("class", "edge" + (status && status.status === "inferred" ? " inferred" : ""));
    line.setAttribute("marker-end", "url(#arr)");
    if (query && !(isHit(visible.find(n => n.id === a.from)) && isHit(visible.find(n => n.id === a.to)))) line.classList.add("dim");
    svg.appendChild(line);

    if (a.label) {
      const len = line.getTotalLength();
      const pt = line.getPointAtLength(len / 2);
      const lw = textWidth(a.label, "10px system-ui, sans-serif") + 12;
      const bg = document.createElementNS(NS, "rect");
      bg.setAttribute("class", "elabel-bg");
      bg.setAttribute("x", pt.x - lw / 2);
      bg.setAttribute("y", pt.y - 10);
      bg.setAttribute("width", lw);
      bg.setAttribute("height", 20);
      bg.setAttribute("rx", 6);
      svg.appendChild(bg);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "elabel");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", pt.y + 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = a.label;
      svg.appendChild(t);
    }
  });

  visible.forEach(n => {
    const p = metrics[n.id]._pos;
    const m = metrics[n.id];
    const s = styleOf(n);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node" + (query && !isHit(n) ? " dim" : ""));
    let shape;
    if (n.kind === "decision") {
      shape = document.createElementNS(NS, "polygon");
      const w = m.width, h = m.height;
      shape.setAttribute("points", `${p.x + w/2},${p.y} ${p.x + w},${p.y + h/2} ${p.x + w/2},${p.y + h} ${p.x},${p.y + h/2}`);
    } else {
      shape = document.createElementNS(NS, "rect");
      shape.setAttribute("x", p.x); shape.setAttribute("y", p.y);
      shape.setAttribute("width", m.width); shape.setAttribute("height", m.height);
      shape.setAttribute("rx", 12);
    }
    shape.setAttribute("fill", "#18181b");
    shape.setAttribute("stroke", s.color);
    shape.setAttribute("stroke-width", 2);
    if (query && isHit(n)) shape.setAttribute("class", "hit");
    g.appendChild(shape);

    if (m.hasIcon) {
      const icon = document.createElementNS(NS, "g");
      icon.setAttribute("transform", `translate(${p.x + 22} ${p.y + m.height/2 - 8}) scale(.6)`);
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", s.color);
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.innerHTML = ICON_PATHS[s.icon] || ICON_PATHS.Box;
      g.appendChild(icon);
    }

    const textX = m.hasIcon ? p.x + 46 : p.x + 16;
    const labelMaxW = m.width - (m.hasIcon ? 56 : 26);
    const labelLines = wrapText(n.label, labelMaxW, "500 12px system-ui, sans-serif");
    labelLines.forEach((ln, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "nlabel");
      t.setAttribute("x", textX);
      t.setAttribute("y", p.y + 22 + i * 14);
      t.textContent = ln;
      g.appendChild(t);
    });

    if (n.summary && n.kind !== "decision") {
      const summaryLines = wrapText(n.summary, labelMaxW, "10px system-ui, sans-serif");
      summaryLines.forEach((ln, i) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("class", "nsummary");
        t.setAttribute("x", textX);
        t.setAttribute("y", p.y + 24 + labelLines.length * 14 + 6 + i * 14);
        t.textContent = ln;
        g.appendChild(t);
      });
    }

    if (n.tests) {
      ["unit", "integration", "e2e"].forEach((k, i) => {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", p.x + m.width - 14 - i * 12); dot.setAttribute("cy", p.y + 14);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", n.tests[k] ? ["#34d399", "#60a5fa", "#f472b6"][i] : "#3f3f46");
        g.appendChild(dot);
      });
    }

    g.addEventListener("click", () => {
      if (n.children && n.children.length) {
        openView(n.label, n.children, []);
      } else if (n.symbol) {
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: n.symbol }, "*");
      } else {
        showSidebar(n);
      }
    });
    svg.appendChild(g);
  });
}

function showSidebar(n) {
  const s = styleOf(n);
  document.getElementById("s-title").textContent = n.label;
  document.getElementById("s-meta").textContent =
    s.icon + " " + n.kind + (n.element_type ? " · " + n.element_type : "") +
    (n.confidence != null ? " · confidence " + n.confidence.toFixed(2) : "");
  document.getElementById("s-tests").innerHTML = n.tests
    ? ["unit", "integration", "e2e"].map(k =>
        '<span class="chip ' + (n.tests[k] ? "on" : "off") + '">' + k + "</span>").join("")
    : "";
  document.getElementById("s-summary").textContent = n.summary || "";

  const extra = document.getElementById("s-extra");
  extra.innerHTML = "";

  const refs = document.getElementById("s-refs");
  refs.innerHTML = "";
  if (n.cross_refs && n.cross_refs.length) {
    const title = document.createElement("div");
    title.className = "meta";
    title.textContent = "Связи:";
    refs.appendChild(title);
    const list = document.createElement("div");
    for (const ref of n.cross_refs) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = ref.label;
      a.style.display = "block";
      a.style.color = "#60a5fa";
      a.style.marginTop = "4px";
      a.style.textDecoration = "none";
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: ref.id, file: ref.file }, "*");
      });
      list.appendChild(a);
    }
    refs.appendChild(list);
  }

  if (n.kind === "call" && n.children && n.children.length) {
    const btn = document.createElement("button");
    btn.className = "expand";
    btn.textContent = "Раскрыть flow";
    btn.addEventListener("click", () => {
      document.getElementById("sidebar").style.display = "none";
      openView(n.label, n.children, []);
    });
    extra.appendChild(btn);
  }

  const code = document.getElementById("s-code");
  if (n.source && sources[n.source.file]) {
    const lines = sources[n.source.file].split("\n");
    const from = Math.max(1, n.source.start_line - 2);
    const to = Math.min(lines.length, n.source.end_line + 2);
    let html = "";
    for (let i = from; i <= to; i++) {
      const esc = lines[i - 1].replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const body = '<span class="ln">' + i + "</span>" + esc;
      html += i >= n.source.start_line && i <= n.source.end_line
        ? '<span class="hl">' + body + "</span>" : body + "\n";
    }
    code.innerHTML = html;
    code.style.display = "block";
  } else {
    code.style.display = "none";
  }
  document.getElementById("sidebar").style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("sidebar").style.display = "none";
});
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
