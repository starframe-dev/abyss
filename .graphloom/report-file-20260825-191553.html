<title>Graphloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #09090b; color: #e4e4e7; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; min-height: 42px; padding: 6px 12px; background: rgba(9,9,11,.94);
         border-bottom: 1px solid #27272a; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #bar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  #bar .crumb { min-width: 0; flex: 1; font-size: 12px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers { display: flex; flex: 0 0 auto; gap: 7px; align-items: center; }
  .lchk { font-size: 11px; color: #a1a1aa; display: flex; gap: 3px; align-items: center; cursor: pointer; white-space: nowrap; }
  #search { flex: 0 0 150px; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; color: #e4e4e7;
            padding: 4px 8px; font-size: 12px; width: 150px; }
  .nav { background: #27272a; border: none; color: #e4e4e7; border-radius: 6px; padding: 4px 9px;
         cursor: pointer; font-size: 12px; }
  .nav:disabled { opacity: .4; cursor: default; }
  #stage { position: fixed; inset: 0; top: 42px; overflow: auto; padding: 24px 0 40px; }
  svg { display: block; }
  .node { cursor: pointer; }
  .node rect, .node polygon { transition: filter .15s; }
  .node:hover rect, .node:hover polygon { filter: brightness(1.25); }
  .node.dim, .edge.dim { opacity: .12; }
  .edge { stroke: #52525b; stroke-width: 1.5; fill: none; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .elabel-bg { fill: #09090b; stroke: #27272a; stroke-width: 1; }
  .elabel { font-size: 10px; fill: #a1a1aa; }
  .nlabel { font-size: 12px; fill: #f4f4f5; font-weight: 500; }
  .nsummary { font-size: 10px; fill: #71717a; }
  .nkind { font-size: 11px; }
  .hit { stroke: #facc15; stroke-width: 2.5; }
  .step { fill: #27272a; stroke: #3f3f46; stroke-width: 1; }
  .step-num { fill: #a1a1aa; font-size: 10px; font-weight: 600; }
  #sidebar { position: fixed; top: 42px; right: 0; bottom: 0; width: 380px; background: #18181b;
             border-left: 1px solid #27272a; padding: 16px; overflow: auto; display: none; z-index: 6; }
  #sidebar h2 { font-size: 16px; margin-bottom: 2px; padding-right: 20px; }
  #sidebar .meta { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  #close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #71717a;
           background: none; border: none; font-size: 16px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
  .chip.on { background: #064e3b; color: #6ee7b7; }
  .chip.off { background: #27272a; color: #71717a; }
  pre.code { margin-top: 12px; background: #09090b; border: 1px solid #27272a; border-radius: 8px;
             padding: 10px; font: 11px/1.6 ui-monospace, monospace; overflow: auto; }
  pre.code .ln { color: #52525b; display: inline-block; width: 34px; user-select: none; }
  pre.code .hl { background: #27272a; display: block; }
  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;
            padding: 5px 12px; cursor: pointer; font-size: 12px; }
</style>

const sources = {"internal/layout/layout.go":"// Package layout computes positions and sizes of DOM nodes using CSS box model.\npackage layout\n\nimport (\n\t\"strings\"\n\n\t\"github.com/starframe/abyss/internal/css\"\n\t\"github.com/starframe/abyss/internal/dom\"\n)\n\n// ViewportWidth is the default viewport width in pixels.\nconst ViewportWidth = 800\n\n// Rect represents a rectangle with position and size.\ntype Rect struct {\n\tX, Y, Width, Height float64\n}\n\n// TextLine is a line of text with its position.\ntype TextLine struct {\n\tText string\n\tX, Y float64\n}\n\n// LayoutBox represents a laid-out element.\ntype LayoutBox struct {\n\tNode      *dom.Node\n\tParent    *LayoutBox\n\tStyle     css.ComputedStyle\n\tContent   Rect // content area (relative to parent content area)\n\tPadding   Rect // padding area\n\tBorder    Rect // border area\n\tMargin    Rect // margin area\n\tChildren  []*LayoutBox\n\tTextLines []TextLine\n}\n\n// Build creates a layout tree from a DOM document and computed styles.\nfunc Build(doc *dom.Node, styles map[*dom.Node]css.ComputedStyle, viewportWidth float64) *LayoutBox {\n\troot := buildNode(doc, styles)\n\tif root != nil {\n\t\tLayout(root, viewportWidth)\n\t}\n\treturn root\n}\n\nfunc buildNode(node *dom.Node, styles map[*dom.Node]css.ComputedStyle) *LayoutBox {\n\tif node.Type == dom.TextNode {\n\t\treturn nil\n\t}\n\n\t// Skip style, script, and head elements - they should not produce layout boxes\n\tif node.Type == dom.ElementNode && (node.TagName == \"style\" || node.TagName == \"script\" || node.TagName == \"head\") {\n\t\treturn nil\n\t}\n\n\tstyle, ok := styles[node]\n\tif !ok {\n\t\tstyle = css.Default()\n\t}\n\n\tif style.Display == css.DisplayNone {\n\t\treturn nil\n\t}\n\n\tbox := &LayoutBox{\n\t\tNode:     node,\n\t\tStyle:    style,\n\t\tChildren: []*LayoutBox{},\n\t}\n\n\tfor _, child := range node.Children {\n\t\tif child.Type == dom.TextNode {\n\t\t\t// Inline text — will be handled during layout\n\t\t\tcontinue\n\t\t}\n\t\tchildBox := buildNode(child, styles)\n\t\tif childBox != nil {\n\t\t\tchildBox.Parent = box\n\t\t\tbox.Children = append(box.Children, childBox)\n\t\t}\n\t}\n\n\treturn box\n}\n\n// Layout computes the geometry of the layout tree.\nfunc Layout(box *LayoutBox, containerWidth float64) {\n\tlayoutBox(box, containerWidth, 0, 0, true)\n}\n\nfunc layoutBox(box *LayoutBox, containerWidth, offsetX, offsetY float64, isRoot bool) {\n\tstyle := box.Style\n\n\t// Resolve width\n\twidth := resolveWidth(style, containerWidth)\n\n\t// Compute box model\n\tmarginLeft := style.Margin.Left.Resolve(containerWidth)\n\tmarginRight := style.Margin.Right.Resolve(containerWidth)\n\tmarginTop := style.Margin.Top.Resolve(containerWidth)\n\tmarginBottom := style.Margin.Bottom.Resolve(containerWidth)\n\tpaddingLeft := style.Padding.Left.Resolve(containerWidth)\n\tpaddingRight := style.Padding.Right.Resolve(containerWidth)\n\tpaddingTop := style.Padding.Top.Resolve(containerWidth)\n\tpaddingBottom := style.Padding.Bottom.Resolve(containerWidth)\n\tborderLeft := style.BorderLeft.Width\n\tborderRight := style.BorderRight.Width\n\tborderTop := style.BorderTop.Width\n\tborderBottom := style.BorderBottom.Width\n\n\t// Content width\n\tcontentWidth := width - paddingLeft - paddingRight - borderLeft - borderRight\n\tif contentWidth < 0 {\n\t\tcontentWidth = 0\n\t}\n\n\t// Position. The offset is the margin-box origin. Build the box model\n\t// from the outside in so padding expands inward instead of overlapping\n\t// preceding siblings.\n\tmarginX := offsetX\n\tmarginY := offsetY\n\tborderX := marginX + marginLeft\n\tborderY := marginY + marginTop\n\n\tif isRoot {\n\t\tmarginX = 0\n\t\tmarginY = 0\n\t\tborderX = marginLeft\n\t\tborderY = marginTop\n\t}\n\n\tif style.Position == css.PositionAbsolute {\n\t\t// Find positioned ancestor\n\t\tancestor := findPositionedAncestor(box)\n\t\tif ancestor != nil {\n\t\t\trefX, refY := ancestor.Content.X, ancestor.Content.Y\n\t\t\tif !style.Top.IsAuto {\n\t\t\t\tborderY = refY + style.Top.Resolve(ancestor.Content.Height)\n\t\t\t}\n\t\t\tif !style.Left.IsAuto {\n\t\t\t\tborderX = refX + style.Left.Resolve(ancestor.Content.Width)\n\t\t\t}\n\t\t\tif !style.Right.IsAuto && style.Left.IsAuto {\n\t\t\t\tborderX = refX + ancestor.Content.Width - width - style.Right.Resolve(ancestor.Content.Width)\n\t\t\t}\n\t\t\tif !style.Bottom.IsAuto && style.Top.IsAuto {\n\t\t\t\tborderHeight := resolveHeight(style, 0) + paddingTop + paddingBottom + borderTop + borderBottom\n\t\t\t\tborderY = refY + ancestor.Content.Height - borderHeight - style.Bottom.Resolve(ancestor.Content.Height)\n\t\t\t}\n\t\t\tmarginX = borderX - marginLeft\n\t\t\tmarginY = borderY - marginTop\n\t\t}\n\t}\n\n\tpaddingX := borderX + borderLeft\n\tpaddingY := borderY + borderTop\n\tcontentX := paddingX + paddingLeft\n\tcontentY := paddingY + paddingTop\n\tpaddingWidth := contentWidth + paddingLeft + paddingRight\n\tborderWidth := paddingWidth + borderLeft + borderRight\n\n\tbox.Content = Rect{X: contentX, Y: contentY, Width: contentWidth, Height: 0}\n\tbox.Padding = Rect{X: paddingX, Y: paddingY, Width: paddingWidth, Height: 0}\n\tbox.Border = Rect{X: borderX, Y: borderY, Width: borderWidth, Height: 0}\n\tbox.Margin = Rect{\n\t\tX:      marginX,\n\t\tY:      marginY,\n\t\tWidth:  borderWidth + marginLeft + marginRight,\n\t\tHeight: 0,\n\t}\n\n\t// Layout children\n\tvar contentHeight float64\n\n\tswitch style.Display {\n\tcase css.DisplayFlex:\n\t\tcontentHeight = layoutFlex(box, contentWidth)\n\tcase css.DisplayGrid:\n\t\tcontentHeight = layoutGrid(box, contentWidth)\n\tcase css.DisplayBlock:\n\t\tcontentHeight = layoutBlockFlow(box, contentWidth)\n\tdefault:\n\t\t// Inline layout\n\t\tcontentHeight = layoutInlineFlow(box, contentWidth)\n\t}\n\n\t// Resolve height\n\theight := contentHeight\n\tif !style.Height.IsAuto {\n\t\theight = style.Height.Resolve(contentHeight)\n\t}\n\n\tbox.Content.Height = height\n\tbox.Padding.Height = height + paddingTop + paddingBottom\n\tbox.Border.Height = box.Padding.Height + borderTop + borderBottom\n\tbox.Margin.Height = box.Border.Height + marginTop + marginBottom\n}\n\nfunc resolveWidth(style css.ComputedStyle, containerWidth float64) float64 {\n\tif !style.Width.IsAuto {\n\t\treturn style.Width.Resolve(containerWidth)\n\t}\n\t// Auto width: fill container minus margins\n\tmarginLeft := style.Margin.Left.Resolve(containerWidth)\n\tmarginRight := style.Margin.Right.Resolve(containerWidth)\n\tw := containerWidth - marginLeft - marginRight\n\tif w < 0 {\n\t\tw = 0\n\t}\n\treturn w\n}\n\nfunc resolveHeight(style css.ComputedStyle, contentHeight float64) float64 {\n\tif !style.Height.IsAuto {\n\t\treturn style.Height.Resolve(contentHeight)\n\t}\n\treturn contentHeight\n}\n\nfunc layoutBlockFlow(box *LayoutBox, contentWidth float64) float64 {\n\tvar y float64\n\tfor _, child := range box.Children {\n\t\tlayoutBox(child, contentWidth, box.Content.X, box.Content.Y+y, false)\n\t\ty += child.Margin.Height\n\t}\n\t// If no block children, process inline content\n\tif y == 0 {\n\t\treturn layoutInlineFlow(box, contentWidth)\n\t}\n\treturn y\n}\n\nfunc layoutInlineFlow(box *LayoutBox, contentWidth float64) float64 {\n\t// Skip text content inside <style> and <script> tags\n\tskip := false\n\tfor p := box.Node; p != nil; p = p.Parent {\n\t\tif p.Type == dom.ElementNode && (p.TagName == \"style\" || p.TagName == \"script\") {\n\t\t\tskip = true\n\t\t\tbreak\n\t\t}\n\t}\n\tif skip {\n\t\treturn 0\n\t}\n\n\t// Collect all text from text nodes and inline children\n\tvar textParts []string\n\tfor _, child := range box.Node.Children {\n\t\tif child.Type == dom.ElementNode && (child.TagName == \"style\" || child.TagName == \"script\") {\n\t\t\t// Skip style and script content\n\t\t\tcontinue\n\t\t}\n\t\tif child.Type == dom.TextNode {\n\t\t\ttext := strings.TrimSpace(child.Text)\n\t\t\tif text != \"\" {\n\t\t\t\ttextParts = append(textParts, text)\n\t\t\t}\n\t\t} else if child.Type == dom.ElementNode {\n\t\t\t// Inline elements: add their text, but skip script/style descendants\n\t\t\ttext := collectVisibleText(child)\n\t\t\tif text != \"\" {\n\t\t\t\ttextParts = append(textParts, text)\n\t\t\t}\n\t\t}\n\t}\n\n\tif len(textParts) == 0 {\n\t\treturn 0\n\t}\n\n\t// Word wrap - concatenate directly, original HTML has correct spacing\n\tallText := strings.Join(textParts, \"\")\n\twords := strings.Fields(allText)\n\tif len(words) == 0 {\n\t\treturn 0\n\t}\n\n\tlineHeight := 2.0 // 1 terminal row = 2 CSS pixels (via █▄▀ block chars)\n\tvar lines []TextLine\n\tvar currentLine string\n\tvar x float64\n\n\tfor _, word := range words {\n\t\twordWidth := float64(len(word)) * 1.0 // 1px per char = 1 terminal column\n\t\tif currentLine != \"\" {\n\t\t\twordWidth += 1.0 // space\n\t\t}\n\t\tif x+wordWidth > contentWidth && currentLine != \"\" {\n\t\t\tlines = append(lines, TextLine{Text: currentLine, X: box.Content.X, Y: box.Content.Y + float64(len(lines))*lineHeight})\n\t\t\tcurrentLine = word\n\t\t\tx = wordWidth\n\t\t} else {\n\t\t\tif currentLine != \"\" {\n\t\t\t\tcurrentLine += \" \"\n\t\t\t}\n\t\t\tcurrentLine += word\n\t\t\tx += wordWidth\n\t\t}\n\t}\n\tif currentLine != \"\" {\n\t\tlines = append(lines, TextLine{Text: currentLine, X: box.Content.X, Y: box.Content.Y + float64(len(lines))*lineHeight})\n\t}\n\n\tbox.TextLines = lines\n\treturn float64(len(lines)) * lineHeight\n}\n\nfunc layoutFlex(box *LayoutBox, contentWidth float64) float64 {\n\tstyle := box.Style\n\tflexDir := style.FlexDirection\n\tgap := style.Gap.Resolve(contentWidth)\n\n\t// Calculate total gap\n\tnumChildren := len(box.Children)\n\tif numChildren == 0 {\n\t\treturn 0\n\t}\n\ttotalGap := gap * float64(numChildren-1)\n\n\t// Calculate available space\n\tvar availableSpace float64\n\tif flexDir == css.FlexDirectionRow {\n\t\tavailableSpace = contentWidth - totalGap\n\t} else {\n\t\tavailableSpace = 100000 // Large number for column height\n\t}\n\n\t// Calculate total flex basis and grow/shrink\n\tvar let views = [{ title: viz.title, nodes: viz.nodes, edges: viz.edges }];
let cursor = 0;
const current = () => views[cursor];

document.getElementById("fwd").addEventListener("click", () => { if (cursor < views.length - 1) { cursor++; render(); } });

function openView(title, nodes, edges) {
  views = views.slice(0, cursor + 1);
  views.push({ title, nodes, edges });
  cursor++;
  render();
}

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
function textWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

function wrapText(text, maxW, font) {
  const words = (text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (textWidth(test, font) <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [text || ""];
}

function nodeMetrics(n) {
  const s = styleOf(n);
  const isDecision = n.kind === "decision";
  const labelFont = "500 12px system-ui, sans-serif";
  const summaryFont = "10px system-ui, sans-serif";
  const maxTextW = isDecision ? 200 : 240;
  const labelLines = wrapText(n.label, maxTextW, labelFont);
  const summaryLines = n.summary && !isDecision ? wrapText(n.summary, maxTextW, summaryFont) : [];
  const labelW = Math.max(...labelLines.map(l => textWidth(l, labelFont)), 0);
  const summaryW = Math.max(...summaryLines.map(l => textWidth(l, summaryFont)), 0);
  const hasIcon = !isDecision;
  const innerW = Math.max(labelW, summaryW) + (hasIcon ? 40 : 0);
  const minW = isDecision ? 180 : 160;
  const maxW = isDecision ? 260 : 320;
  const width = Math.max(minW, Math.min(maxW, innerW + 32));
  const lineH = 14;
  const labelH = 12 + (labelLines.length - 1) * lineH;
  const summaryH = summaryLines.length ? 6 + summaryLines.length * lineH : 0;
  const height = 28 + labelH + summaryH;
  return { width, height, labelLines, summaryLines, labelH, summaryH, isDecision, hasIcon, color: s.color, icon: s.icon };
}

function sequentialize(arcs, visible, level) {
  if (level !== "file" && level !== "function") return arcs;
  const lineOf = id => {
    const n = visible.find(x => x.id === id);
    return n && n.source ? n.source.start_line : 0;
  };
  const out = {};
  arcs.forEach(a => {
    (out[a.from] = out[a.from] || []).push(a);
  });
  const keep = new Set();
  const add = [];
  Object.keys(out).forEach(src => {
    const srcNode = visible.find(x => x.id === src);
    if (!srcNode || srcNode.kind === "decision") return;
    const outs = out[src]
      .filter(a => visible.find(x => x.id === a.to))
      .slice()
      .sort((a, b) => lineOf(a.to) - lineOf(b.to));
    if (outs.length < 2) return;
    keep.add(`${outs[0].from}→${outs[0].to}`);
    for (let i = 1; i < outs.length; i++) {
      add.push({ from: outs[i - 1].to, to: outs[i].to, label: outs[i].label });
    }
  });
  return arcs.filter(a => {
    const srcNode = visible.find(x => x.id === a.from);
    if (srcNode && srcNode.kind === "decision") return true;
    if (!out[a.from] || out[a.from].length < 2) return true;
    return keep.has(`${a.from}→${a.to}`);
  }).concat(add);
}

function layout(viewNodes, viewEdges) {
  const visible = viewNodes.filter(n => activeLayers.has(n.layer));
  const ids = new Set(visible.map(n => n.id));
  let arcs = viewEdges.filter(e => ids.has(e.from) && ids.has(e.to)).map(e => ({ ...e }));
  visible.forEach(n => {
    if (n.kind === "decision" && n.branches) {
      n.branches.forEach(b => {
        if (ids.has(b.target)) arcs.push({ from: n.id, to: b.target, label: b.condition });
      });
    }
  });
  arcs = sequentialize(arcs, visible, viz.level);

  const layer = {};
  visible.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < visible.length; i++) {
    arcs.forEach(a => { if (layer[a.to] <= layer[a.from]) layer[a.to] = layer[a.from] + 1; });
  }

  const metrics = {};
  visible.forEach(n => metrics[n.id] = nodeMetrics(n));

  const groups = new Map();
  visible.forEach(n => {
    const l = layer[n.id];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(n);
  });

  const preds = {};
  arcs.forEach(a => { (preds[a.to] = preds[a.to] || []).push(a.from); });

  const sortedLayers = [...groups.keys()].sort((a, b) => a - b);
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    group.forEach(n => {
      const ps = (preds[n.id] || []).filter(p => metrics[p]._pos);
      n._bary = ps.length ? ps.reduce((s, p) => s + metrics[p]._pos.x + metrics[p].width / 2, 0) / ps.length : Infinity;
    });
    group.sort((a, b) => (a._bary - b._bary) || a.id.localeCompare(b.id));
    let x = 40;
    group.forEach(n => {
      metrics[n.id]._pos = { x, y: 0 };
      x += metrics[n.id].width + 40;
    });
  });

  let maxLayerWidth = 0;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const last = group[group.length - 1];
    const w = metrics[last.id]._pos.x + metrics[last.id].width;
    if (w > maxLayerWidth) maxLayerWidth = w;
  });

  let y = 40;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const maxH = Math.max(...group.map(n => metrics[n.id].height));
    group.forEach(n => { metrics[n.id]._pos.y = y + (maxH - metrics[n.id].height) / 2; });
    const layerW = Math.max(...group.map(n => metrics[n.id]._pos.x + metrics[n.id].width));
    const offset = (maxLayerWidth - layerW) / 2;
    group.forEach(n => { metrics[n.id]._pos.x += Math.max(0, offset); });
    y += maxH + 70;
  });

  visible.forEach(n => { n._shape = "process"; });

  let step = 1;
  sortedLayers.forEach(l => groups.get(l).forEach(n => { n._step = step++; }));

  return { visible, arcs, metrics };
}

    const tx = p2.x + m2.width / 2;

    line.setAttribute("marker-end", "url(#arr)");
    if (query && !(isHit(visible.find(n => n.id === a.from)) && isHit(visible.find(n => n.id === a.to)))) line.classList.add("dim");
    svg.appendChild(line);

    if (a.label) {
      const len = line.getTotalLength();
      const pt = line.getPointAtLength(len / 2);

      const bg = document.createElementNS(NS, "rect");

      bg.setAttribute("x", pt.x - lw / 2);
      bg.setAttribute("y", pt.y - 10);
      bg.setAttribute("width", lw);
      bg.setAttribute("height", 20);
      bg.setAttribute("rx", 6);
      svg.appendChild(bg);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "elabel");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", pt.y + 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = a.label;
      svg.appendChild(t);
    }
  });

  visible.forEach(n => {
    const p = metrics[n.id]._pos;
    const m = metrics[n.id];
    const s = styleOf(n);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node" + (query && !isHit(n) ? " dim" : ""));
    let shape;
    shape = document.createElementNS(NS, "rect");
    shape.setAttribute("x", p.x); shape.setAttribute("y", p.y);
    shape.setAttribute("width", m.width); shape.setAttribute("height", m.height);
    shape.setAttribute("rx", 12);
    shape.setAttribute("fill", "#18181b");
    shape.setAttribute("stroke", s.color);
    shape.setAttribute("stroke-width", 2);
    if (query && isHit(n)) shape.setAttribute("class", "hit");
    g.appendChild(shape);

    const badge = document.createElementNS(NS, "circle");
    badge.setAttribute("class", "step");
    badge.setAttribute("cx", p.x + 12); badge.setAttribute("cy", p.y + 12); badge.setAttribute("r", 8);
    g.appendChild(badge);
    const bnum = document.createElementNS(NS, "text");
    bnum.setAttribute("class", "step-num");
    bnum.setAttribute("x", p.x + 12); bnum.setAttribute("y", p.y + 15);
    bnum.setAttribute("text-anchor", "middle");
    bnum.textContent = n._step;
    g.appendChild(bnum);

    if (m.hasIcon) {
      const icon = document.createElementNS(NS, "g");
      icon.setAttribute("transform", `translate(${p.x + 22} ${p.y + m.height/2 - 8}) scale(.6)`);
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", s.color);
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.innerHTML = ICON_PATHS[s.icon] || ICON_PATHS.Box;
      g.appendChild(icon);
    }

    const textX = m.hasIcon ? p.x + 46 : p.x + 16;
    const labelMaxW = m.width - (m.hasIcon ? 56 : 26);
    const labelLines = wrapText(n.label, labelMaxW, "500 12px system-ui, sans-serif");
    labelLines.forEach((ln, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "nlabel");
      t.setAttribute("x", textX);
      t.setAttribute("y", p.y + 22 + i * 14);
      t.textContent = ln;
      g.appendChild(t);
    });

    if (n.summary) {
      const summaryLines = wrapText(n.summary, labelMaxW, "10px system-ui, sans-serif");
      summaryLines.forEach((ln, i) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("class", "nsummary");
        t.setAttribute("x", textX);
        t.setAttribute("y", p.y + 24 + labelLines.length * 14 + 6 + i * 14);
        t.textContent = ln;
        g.appendChild(t);
      });
    }

    if (n.tests) {
      ["unit", "integration", "e2e"].forEach((k, i) => {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", p.x + m.width - 14 - i * 12); dot.setAttribute("cy", p.y + 14);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", n.tests[k] ? ["#34d399", "#60a5fa", "#f472b6"][i] : "#3f3f46");
        g.appendChild(dot);
      });
    }

    g.addEventListener("click", () => showSidebar(n));
    svg.appendChild(g);
  });
}

function showSidebar(n) {
  const s = styleOf(n);
  document.getElementById("s-title").textContent = n.label;
  document.getElementById("s-meta").textContent =
    s.icon + " " + n.kind + (n.element_type ? " · " + n.element_type : "") +
    (n.confidence != null ? " · confidence " + n.confidence.toFixed(2) : "");
  document.getElementById("s-tests").innerHTML = n.tests
    ? ["unit", "integration", "e2e"].map(k =>
        '<span class="chip ' + (n.tests[k] ? "on" : "off") + '">' + k + "</span>").join("")
    : "";
  document.getElementById("s-summary").textContent = n.summary || "";

  const extra = document.getElementById("s-extra");
  extra.innerHTML = "";
  if (n.kind === "call" && n.children && n.children.length) {
    const btn = document.createElement("button");
    btn.className = "expand";
    btn.textContent = "Раскрыть flow";
    btn.addEventListener("click", () => {
      document.getElementById("sidebar").style.display = "none";
      openView(n.label, n.children, []);
    });
    extra.appendChild(btn);
  }

  const code = document.getElementById("s-code");
  if (n.source && sources[n.source.file]) {
    const lines = sources[n.source.file].split("\n");
    const from = Math.max(1, n.source.start_line - 2);
    const to = Math.min(lines.length, n.source.end_line + 2);
    let html = "";
    for (let i = from; i <= to; i++) {
      const esc = lines[i - 1].replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const body = '<span class="ln">' + i + "</span>" + esc;
      html += i >= n.source.start_line && i <= n.source.end_line
        ? '<span class="hl">' + body + "</span>" : body + "\n";
    }
    code.innerHTML = html;
    code.style.display = "block";
  } else {
    code.style.display = "none";
  }
  document.getElementById("sidebar").style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("sidebar").style.display = "none";
});
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
</html>
