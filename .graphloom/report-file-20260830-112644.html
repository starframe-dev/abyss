  .nsummary { font-size: 9px; fill: #71717a; }
  .nkind { font-size: 11px; }
  .hit { stroke: #facc15; stroke-width: 2.5; }

const sources = {"internal/layout/layout.go":"// Package layout computes positions and sizes of DOM nodes using CSS box model.\npackage layout\n\nimport (\n\t\"strings\"\n\n\t\"github.com/starframe/abyss/internal/css\"\n\t\"github.com/starframe/abyss/internal/dom\"\n)\n\n// ViewportWidth is the default viewport width in pixels.\nconst ViewportWidth = 800\n\n// Rect represents a rectangle with position and size.\ntype Rect struct {\n\tX, Y, Width, Height float64\n}\n\n// TextLine is a line of text with its position.\ntype TextLine struct {\n\tText string\n\tX, Y float64\n}\n\n// LayoutBox represents a laid-out element.\ntype LayoutBox struct {\n\tNode      *dom.Node\n\tParent    *LayoutBox\n\tStyle     css.ComputedStyle\n\tContent   Rect // content area (relative to parent content area)\n\tPadding   Rect // padding area\n\tBorder    Rect // border area\n\tMargin    Rect // margin area\n\tChildren  []*LayoutBox\n\tTextLines []TextLine\n}\n\n// Build creates a layout tree from a DOM document and computed styles.\nfunc Build(doc *dom.Node, styles map[*dom.Node]css.ComputedStyle, viewportWidth float64) *LayoutBox {\n\troot := buildNode(doc, styles)\n\tif root != nil {\n\t\tLayout(root, viewportWidth)\n\t}\n\treturn root\n}\n\nfunc buildNode(node *dom.Node, styles map[*dom.Node]css.ComputedStyle) *LayoutBox {\n\tif node.Type == dom.TextNode {\n\t\treturn nil\n\t}\n\n\t// Skip style, script, and head elements - they should not produce layout boxes\n\tif node.Type == dom.ElementNode && (node.TagName == \"style\" || node.TagName == \"script\" || node.TagName == \"head\") {\n\t\treturn nil\n\t}\n\n\tstyle, ok := styles[node]\n\tif !ok {\n\t\tstyle = css.Default()\n\t}\n\n\tif style.Display == css.DisplayNone {\n\t\treturn nil\n\t}\n\n\tbox := &LayoutBox{\n\t\tNode:     node,\n\t\tStyle:    style,\n\t\tChildren: []*LayoutBox{},\n\t}\n\n\tfor _, child := range node.Children {\n\t\tif child.Type == dom.TextNode {\n\t\t\t// Inline text — will be handled during layout\n\t\t\tcontinue\n\t\t}\n\t\tchildBox := buildNode(child, styles)\n\t\tif childBox != nil {\n\t\t\tchildBox.Parent = box\n\t\t\tbox.Children = append(box.Children, childBox)\n\t\t}\n\t}\n\n\treturn box\n}\n\n// Layout computes the geometry of the layout tree.\nfunc Layout(box *LayoutBox, containerWidth float64) {\n\tlayoutBox(box, containerWidth, 0, 0, true)\n}\n\nfunc layoutBox(box *LayoutBox, containerWidth, offsetX, offsetY float64, isRoot bool) {\n\tstyle := box.Style\n\n\t// Resolve width\n\twidth := resolveWidth(style, containerWidth)\n\n\t// Compute box model\n\tmarginLeft := style.Margin.Left.Resolve(containerWidth)\n\tmarginRight := style.Margin.Right.Resolve(containerWidth)\n\tmarginTop := style.Margin.Top.Resolve(containerWidth)\n\tmarginBottom := style.Margin.Bottom.Resolve(containerWidth)\n\tpaddingLeft := style.Padding.Left.Resolve(containerWidth)\n\tpaddingRight := style.Padding.Right.Resolve(containerWidth)\n\tpaddingTop := style.Padding.Top.Resolve(containerWidth)\n\tpaddingBottom := style.Padding.Bottom.Resolve(containerWidth)\n\tborderLeft := style.BorderLeft.Width\n\tborderRight := style.BorderRight.Width\n\tborderTop := style.BorderTop.Width\n\tborderBottom := style.BorderBottom.Width\n\n\t// Content width\n\tcontentWidth := width - paddingLeft - paddingRight - borderLeft - borderRight\n\tif contentWidth < 0 {\n\t\tcontentWidth = 0\n\t}\n\n\t// Position. The offset is the margin-box origin. Build the box model\n\t// from the outside in so padding expands inward instead of overlapping\n\t// preceding siblings.\n\tmarginX := offsetX\n\tmarginY := offsetY\n\tborderX := marginX + marginLeft\n\tborderY := marginY + marginTop\n\n\tif isRoot {\n\t\tmarginX = 0\n\t\tmarginY = 0\n\t\tborderX = marginLeft\n\t\tborderY = marginTop\n\t}\n\n\tif style.Position == css.PositionAbsolute {\n\t\t// Find positioned ancestor\n\t\tancestor := findPositionedAncestor(box)\n\t\tif ancestor != nil {\n\t\t\trefX, refY := ancestor.Content.X, ancestor.Content.Y\n\t\t\tif !style.Top.IsAuto {\n\t\t\t\tborderY = refY + style.Top.Resolve(ancestor.Content.Height)\n\t\t\t}\n\t\t\tif !style.Left.IsAuto {\n\t\t\t\tborderX = refX + style.Left.Resolve(ancestor.Content.Width)\n\t\t\t}\n\t\t\tif !style.Right.IsAuto && style.Left.IsAuto {\n\t\t\t\tborderX = refX + ancestor.Content.Width - width - style.Right.Resolve(ancestor.Content.Width)\n\t\t\t}\n\t\t\tif !style.Bottom.IsAuto && style.Top.IsAuto {\n\t\t\t\tborderHeight := resolveHeight(style, 0) + paddingTop + paddingBottom + borderTop + borderBottom\n\t\t\t\tborderY = refY + ancestor.Content.Height - borderHeight - style.Bottom.Resolve(ancestor.Content.Height)\n\t\t\t}\n\t\t\tmarginX = borderX - marginLeft\n\t\t\tmarginY = borderY - marginTop\n\t\t}\n\t}\n\n\tpaddingX := borderX + borderLeft\n\tpaddingY := borderY + borderTop\n\tcontentX := paddingX + paddingLeft\n\tcontentY := paddingY + paddingTop\n\tpaddingWidth := contentWidth + paddingLeft + paddingRight\n\tborderWidth := paddingWidth + borderLeft + borderRight\n\n\tbox.Content = Rect{X: contentX, Y: contentY, Width: contentWidth, Height: 0}\n\tbox.Padding = Rect{X: paddingX, Y: paddingY, Width: paddingWidth, Height: 0}\n\tbox.Border = Rect{X: borderX, Y: borderY, Width: borderWidth, Height: 0}\n\tbox.Margin = Rect{\n\t\tX:      marginX,\n\t\tY:      marginY,\n\t\tWidth:  borderWidth + marginLeft + marginRight,\n\t\tHeight: 0,\n\t}\n\n\t// Layout children\n\tvar contentHeight float64\n\n\tswitch style.Display {\n\tcase css.DisplayFlex:\n\t\tcontentHeight = layoutFlex(box, contentWidth)\n\tcase css.DisplayGrid:\n\t\tcontentHeight = layoutGrid(box, contentWidth)\n\tcase css.DisplayBlock:\n\t\tcontentHeight = layoutBlockFlow(box, contentWidth)\n\tdefault:\n\t\t// Inline layout\n\t\tcontentHeight = layoutInlineFlow(box, contentWidth)\n\t}\n\n\t// Resolve height\n\theight := contentHeight\n\tif !style.Height.IsAuto {\n\t\theight = style.Height.Resolve(contentHeight)\n\t}\n\n\tbox.Content.Height = height\n\tbox.Padding.Height = height + paddingTop + paddingBottom\n\tbox.Border.Height = box.Padding.Height + borderTop + borderBottom\n\tbox.Margin.Height = box.Border.Height + marginTop + marginBottom\n}\n\nfunc resolveWidth(style css.ComputedStyle, containerWidth float64) float64 {\n\tif !style.Width.IsAuto {\n\t\treturn style.Width.Resolve(containerWidth)\n\t}\n\t// Auto width: fill container minus margins\n\tmarginLeft := style.Margin.Left.Resolve(containerWidth)\n\tmarginRight := style.Margin.Right.Resolve(containerWidth)\n\tw := containerWidth - marginLeft - marginRight\n\tif w < 0 {\n\t\tw = 0\n\t}\n\treturn w\n}\n\nfunc resolveHeight(style css.ComputedStyle, contentHeight float64) float64 {\n\tif !style.Height.IsAuto {\n\t\treturn style.Height.Resolve(contentHeight)\n\t}\n\treturn contentHeight\n}\n\nfunc layoutBlockFlow(box *LayoutBox, contentWidth float64) float64 {\n\tvar y float64\n\tfor _, child := range box.Children {\n\t\tlayoutBox(child, contentWidth, box.Content.X, box.Content.Y+y, false)\n\t\ty += child.Margin.Height\n\t}\n\t// If no block children, process inline content\n\tif y == 0 {\n\t\treturn layoutInlineFlow(box, contentWidth)\n\t}\n\treturn y\n}\n\nfunc layoutInlineFlow(box *LayoutBox, contentWidth float64) float64 {\n\t// Skip text content inside <style> and <script> tags\n\tif inStyleOrScript(box.Node) {\n\t\treturn 0\n\t}\n\n\ttextParts := collectInlineText(box.Node)\n\tif len(textParts) == 0 {\n\t\treturn 0\n\t}\n\n\t// Word wrap - concatenate directly, original HTML has correct spacing\n\tallText := strings.Join(textParts, \"\")\n\twords := strings.Fields(allText)\n\tif len(words) == 0 {\n\t\treturn 0\n\t}\n\n\tlines := wordWrap(words, box, contentWidth)\n\tbox.TextLines = lines\n\treturn float64(len(lines)) * 2.0\n}\n\nfunc inStyleOrScript(n *dom.Node) bool {\n\tfor p := n; p != nil; p = p.Parent {\n\t\tif p.Type == dom.ElementNode && (p.TagName == \"style\" || p.TagName == \"script\") {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\nfunc collectInlineText(n *dom.Node) []string {\n\tvar textParts []string\n\tfor _, child := range n.Children {\n\t\tif child.Type == dom.ElementNode && (child.TagName == \"style\" || child.TagName == \"script\") {\n\t\t\t// Skip style and script content\n\t\t\tcontinue\n\t\t}\n\t\tif child.Type == dom.TextNode {\n\t\t\ttext := strings.TrimSpace(child.Text)\n\t\t\tif text != \"\" {\n\t\t\t\ttextParts = append(textParts, text)\n\t\t\t}\n\t\t} else if child.Type == dom.ElementNode {\n\t\t\t// Inline elements: add their text, but skip script/style descendants\n\t\t\ttext := collectVisibleText(child)\n\t\t\tif text != \"\" {\n\t\t\t\ttextParts = append(textParts, text)\n\t\t\t}\n\t\t}\n\t}\n\treturn textParts\n}\n\nfunc wordWrap(words []string, box *LayoutBox, contentWidth float64) []TextLine {\n\tlineHeight := 2.0 // 1 terminal row = 2 CSS pixels (via █▄▀ block chars)\n\tvar lines []TextLine\n\tvar currentLine string\n\tvar x float64\n\n\tfor _, word := range words {\n\t\twordWidth := float64(len(word)) * 1.0 // 1px per char = 1 terminal column\n\t\tif currentLine != \"\" {\n\t\t\twordWidth += 1.0 // space\n\t\t}\n\t\tif x+wordWidth > contentWidth && currentLine != \"\" {\n\t\t\tlines = append(lines, TextLine{Text: currentLine, X: box.Content.X, Y: box.Content.Y + float64(len(lines))*lineHeight})\n\t\t\tcurrentLine = word\n\t\t\tx = wordWidth\n\t\t} else {\n\t\t\tif currentLine != \"\" {\n\t\t\t\tcurrentLine += \" \"\n\t\t\t}\n\t\t\tcurrentLine += word\n\t\t\tx += wordWidth\n\t\t}\n\t}\n\tif currentLine != \"\" {\n\t\tlines = append(lines, TextLine{Text: currentLine, X: box.Content.X, Y: box.Content.Y + float64(len(lines))*lineHeight})\n\t}\n\treturn lines\n}\n\nfunc findPositionedAncestor(box *LayoutBox) *LayoutBox {\n\tcurrent := box.Parent\n\tfor current != nil {\n\t\tif current.Style.Position == css.PositionRelative || current.Style.Position == css.PositionAbsolute {\n\t\t\treturn current\n\t\t}\n\t\tcurrent = current.Parent\n\t}\n\treturn nil\n}\n\nfunc estimateTextWidth(text string) float64 {\n\treturn float64(len([]rune(text))) * 1.0 // 1px per char = 1 terminal column\n}\n\n// collectVisibleText returns text content skipping <script> and <style> descendants.\nfunc collectVisibleText(n *dom.Node) string {\n\tif n.Type == dom.TextNode {\n\t\treturn n.Text\n\t}\n\tif n.Type == dom.ElementNode && (n.TagName == \"script\" || n.TagName == \"style\") {\n\t\treturn \"\"\n\t}\n\tvar b strings.Builder\n\tfor _, child := range n.Children {\n\t\tb.WriteString(collectVisibleText(child))\n\t}\n\treturn b.String()\n}"};

  ? { color: paletteStyle[n.element_type].color, icon: paletteStyle[n.element_type].icon }
  : KIND_STYLE[n.kind] || KIND_STYLE.action;

const LAYERS = ["flow", "calls", "data", "state", "effects"];
const activeLayers = new Set(LAYERS);
const layersBox = document.getElementById("layers");
LAYERS.forEach(l => {
  const label = document.createElement("label");
  label.className = "lchk";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = true;
  cb.addEventListener("change", () => {
    cb.checked ? activeLayers.add(l) : activeLayers.delete(l);
    render();
  });
  label.appendChild(cb);
  label.appendChild(document.createTextNode(l));
  layersBox.appendChild(label);
});

let views = [{ title: viz.title, nodes: viz.nodes, edges: viz.edges }];
let cursor = 0;
const current = () => views[cursor];

document.getElementById("back").addEventListener("click", () => { if (cursor > 0) { cursor--; render(); } });
document.getElementById("fwd").addEventListener("click", () => { if (cursor < views.length - 1) { cursor++; render(); } });

function openView(title, nodes, edges) {
  views = views.slice(0, cursor + 1);
  views.push({ title, nodes, edges });
  cursor++;
  render();
}

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
function textWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

function wrapText(text, maxW, font) {
  const words = (text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (textWidth(test, font) <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [text || ""];
}

function nodeMetrics(n) {
  const s = styleOf(n);
  const labelFont = "500 11px system-ui, sans-serif";
  const summaryFont = "9px system-ui, sans-serif";
  const maxTextW = n.kind === "decision" ? 200 : 220;
  const labelLines = wrapText(n.label, maxTextW, labelFont);
  const summaryLines = n.summary ? wrapText(n.summary, maxTextW, summaryFont) : [];
  const labelW = Math.max(...labelLines.map(l => textWidth(l, labelFont)), 0);
  const summaryW = Math.max(...summaryLines.map(l => textWidth(l, summaryFont)), 0);
  const hasIcon = true;
  const innerW = Math.max(labelW, summaryW) + (hasIcon ? 32 : 0);
  const minW = n.kind === "decision" ? 168 : 140;
  const maxW = n.kind === "decision" ? 280 : 300;
  const width = Math.max(minW, Math.min(maxW, innerW + 24));
  const lineH = 13;
  const labelH = 11 + (labelLines.length - 1) * lineH;
  const summaryH = summaryLines.length ? 4 + summaryLines.length * lineH : 0;
  const height = 22 + labelH + summaryH;
  return { width, height, labelLines, summaryLines, labelH, summaryH, hasIcon, color: s.color, icon: s.icon };
}

function sequentialize(arcs, visible, level) {
  if (level !== "file" && level !== "function") return arcs;
  const lineOf = id => {
    const n = visible.find(x => x.id === id);
    return n && n.source ? n.source.start_line : 0;
  };
  const out = {};
  arcs.forEach(a => { (out[a.from] = out[a.from] || []).push(a); });
  const keep = new Set();
  const add = [];
  Object.keys(out).forEach(src => {
    const srcNode = visible.find(x => x.id === src);
    if (!srcNode || srcNode.kind === "decision") return;
    const outs = out[src]
      .filter(a => visible.find(x => x.id === a.to))
      .slice()
      .sort((a, b) => lineOf(a.to) - lineOf(b.to));
    if (outs.length < 2) return;
    keep.add(`${outs[0].from}→${outs[0].to}`);
    for (let i = 1; i < outs.length; i++) {
      add.push({ from: outs[i - 1].to, to: outs[i].to, label: outs[i].label });
    }
  });
  return arcs.filter(a => {
    const srcNode = visible.find(x => x.id === a.from);
    if (srcNode && srcNode.kind === "decision") return true;
    if (!out[a.from] || out[a.from].length < 2) return true;
    return keep.has(`${a.from}→${a.to}`);
  }).concat(add);
}

function layeredLayout(nodes, edges) {
  const visible = nodes.filter(n => activeLayers.has(n.layer));
  const ids = new Set(visible.map(n => n.id));
  let arcs = edges.filter(e => ids.has(e.from) && ids.has(e.to)).map(e => ({ ...e }));
  visible.forEach(n => {
    if (n.kind === "decision" && n.branches) {
      n.branches.forEach(b => {
        if (ids.has(b.target)) arcs.push({ from: n.id, to: b.target, label: b.condition });
      });
    }
  });
  arcs = sequentialize(arcs, visible, viz.level);

  const layer = {};
  visible.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < visible.length; i++) {
    arcs.forEach(a => { if (layer[a.to] <= layer[a.from]) layer[a.to] = layer[a.from] + 1; });
  }

  const metrics = {};
  visible.forEach(n => metrics[n.id] = nodeMetrics(n));

  const groups = new Map();
  visible.forEach(n => {
    const l = layer[n.id];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(n);
  });

  const preds = {};
  arcs.forEach(a => { (preds[a.to] = preds[a.to] || []).push(a.from); });

  const sortedLayers = [...groups.keys()].sort((a, b) => a - b);
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    group.forEach(n => {
      const ps = (preds[n.id] || []).filter(p => metrics[p]._pos);
      n._bary = ps.length ? ps.reduce((s, p) => s + metrics[p]._pos.x + metrics[p].width / 2, 0) / ps.length : Infinity;
    });
    group.sort((a, b) => (a._bary - b._bary) || a.id.localeCompare(b.id));
    let x = 40;
    group.forEach(n => {
      metrics[n.id]._pos = { x, y: 0 };
      x += metrics[n.id].width + 40;
    });
  });

  let maxLayerWidth = 0;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const last = group[group.length - 1];
    const w = metrics[last.id]._pos.x + metrics[last.id].width;
    if (w > maxLayerWidth) maxLayerWidth = w;
  });

  let y = 40;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const maxH = Math.max(...group.map(n => metrics[n.id].height));
    group.forEach(n => { metrics[n.id]._pos.y = y + (maxH - metrics[n.id].height) / 2; });
    const layerW = Math.max(...group.map(n => metrics[n.id]._pos.x + metrics[n.id].width));
    const offset = (maxLayerWidth - layerW) / 2;
    group.forEach(n => { metrics[n.id]._pos.x += Math.max(0, offset); });
    y += maxH + 70;
  });

  return { visible, arcs, metrics };
}

function treeLayout(nodes, sourceEdges) {
  const root = nodes[0];
  if (!root) return { visible: [], arcs: [], metrics: {}, regions: [], header: null };

  const parentById = {};
  function index(node, parentId = null) {
    if (parentId) parentById[node.id] = parentId;
    (node.children || []).forEach(child => index(child, node.id));
  }
  index(root);

  const isFileRoot = root.kind === "group" && !root.symbol && root.id.startsWith("file:");
  const header = isFileRoot
    ? {
        label: (root.label || root.source?.file || root.id).trim(),
        summary: (root.summary || "").trim()
      }
    : null;

  function filter(node) {
    const children = collapsedNodes.has(node.id)
      ? []
      : (node.children || [])
        .filter(c => activeLayers.has(c.layer))
        .map(filter);
    return { node, children };
  }
  const tree = isFileRoot
    ? { node: null, depth: 0, children: (root.children || []).filter(c => activeLayers.has(c.layer)).map(filter) }
    : filter(root);
  const flat = [];

  function collect(t, depth) {
    t.depth = depth;
    if (t.node) flat.push(t.node);
    t.children.forEach(child => collect(child, depth + 1));
  }
  collect(tree, 0);
  const visibleIds = new Set(flat.map(node => node.id));

  const metrics = {};
  let y = 40;
  flat.forEach(node => {
    const metric = nodeMetrics(node);
    const depth = findTreeDepth(tree, node.id);
    metric._pos = { x: 40 + depth * TREE_INDENT, y };
    node._metrics = metric;
    metrics[node.id] = metric;
    y += metric.height + TREE_GAP_Y;
  });

  const regions = [];
  function bounds(t) {
    if (!t.node) {
      let aggregate = null;
      t.children.forEach(child => {
        const childBounds = bounds(child);
        if (!aggregate) aggregate = childBounds;
        else {
          aggregate.left = Math.min(aggregate.left, childBounds.left);
          aggregate.top = Math.min(aggregate.top, childBounds.top);
          aggregate.right = Math.max(aggregate.right, childBounds.right);
          aggregate.bottom = Math.max(aggregate.bottom, childBounds.bottom);
          aggregate.nodeIds = aggregate.nodeIds.concat(childBounds.nodeIds);
        }
      });
      return aggregate || { left: 0, top: 0, right: 0, bottom: 0, nodeIds: [] };
    }

    const metric = metrics[t.node.id];
    const pos = metric._pos;
    let left = pos.x - TREE_REGION_PADDING;
    let top = pos.y - TREE_REGION_PADDING;
    let right = pos.x + metric.width + TREE_REGION_PADDING;
    let bottom = pos.y + metric.height + TREE_REGION_PADDING;
    let nodeIds = [t.node.id];

    t.children.forEach(child => {
      const childBounds = bounds(child);
      left = Math.min(left, childBounds.left - TREE_REGION_NESTING_GAP);
      top = Math.min(top, childBounds.top - TREE_REGION_NESTING_GAP);
      right = Math.max(right, childBounds.right + TREE_REGION_NESTING_GAP);
      bottom = Math.max(bottom, childBounds.bottom + TREE_REGION_NESTING_GAP);
      nodeIds = nodeIds.concat(childBounds.nodeIds);
    });

    if (t.children.length) {
      regions.push({
        id: t.node.id,
        depth: t.depth,
        x: left,
        y: top,
        width: right - left,
        height: bottom - top,
        color: metric.color,
        nodeIds
      });
    }
    return { left, top, right, bottom, nodeIds };
  }
  bounds(tree);
  regions.sort((a, b) => a.depth - b.depth);

  const edges = [];
  function addStructuralEdges(t) {
    t.children.forEach(child => {
      if (t.node) edges.push({ from: t.node.id, to: child.node.id, label: null, status: null });
      addStructuralEdges(child);
    });
  }
  addStructuralEdges(tree);

  function visibleAncestor(id) {
    let currentId = id;
    while (currentId && !visibleIds.has(currentId)) {
      const parentId = parentById[currentId];
      if (!parentId) return null;
      currentId = parentId;
    }
    return currentId || null;
  }
  const seen = new Set(edges.map(edge => `${edge.from}→${edge.to}`));
  (sourceEdges || []).forEach(edge => {
    const from = visibleAncestor(edge.from);
    const to = visibleAncestor(edge.to);
    if (!from || !to || from === to) return;
    const key = `${from}→${to}`;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from, to, label: edge.label, status: edge.status });
  });

  return { visible: flat, arcs: edges, metrics, regions, header };
}

function findTreeDepth(tree, nodeId) {
  if (tree.node && tree.node.id === nodeId) return tree.depth;
  for (const child of tree.children) {
    const depth = findTreeDepth(child, nodeId);
    if (depth >= 0) return depth;
  }
  return -1;
}

function isTreeView(view) {
  return view.nodes.length === 1 && view.nodes[0].children && view.nodes[0].children.length > 0;
}

const NS = "http://www.w3.org/2000/svg";
const TREE_INDENT = 44;
const TREE_REGION_PADDING = 18;
const TREE_REGION_NESTING_GAP = 10;
const TREE_GAP_Y = 28;
const collapsedNodes = new Set();
let query = "";

function render() {
  const view = current();
  document.getElementById("crumb").textContent = view.title;
  document.getElementById("back").disabled = cursor === 0;
  document.getElementById("fwd").disabled = cursor === views.length - 1;

  const isTree = isTreeView(view);
  const layout = isTree
    ? treeLayout(view.nodes, view.edges)
    : layeredLayout(view.nodes, view.edges);
  const { visible, arcs, metrics, regions = [], header = null } = layout;
  const fileDescription = document.getElementById("file-description");
  const fileLabel = document.getElementById("file-label");
  const fileSummary = document.getElementById("file-summary");
  fileLabel.textContent = header ? header.label : "";
  fileSummary.textContent = header ? header.summary : "";
  fileSummary.style.display = header && header.summary ? "inline" : "none";
  fileDescription.style.display = header ? "block" : "none";
  const barHeight = document.getElementById("bar").getBoundingClientRect().height;
  document.getElementById("stage").style.top = `${barHeight}px`;
  document.getElementById("sidebar").style.top = `${barHeight}px`;

  const svg = document.getElementById("svg");
  svg.innerHTML = "";
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  visible.forEach(n => {
    const m = metrics[n.id];
    minX = Math.min(minX, m._pos.x);
    minY = Math.min(minY, m._pos.y);
    maxX = Math.max(maxX, m._pos.x + m.width);
    maxY = Math.max(maxY, m._pos.y + m.height);
  });
  regions.forEach(region => {
    minX = Math.min(minX, region.x);
    minY = Math.min(minY, region.y);
    maxX = Math.max(maxX, region.x + region.width);
    maxY = Math.max(maxY, region.y + region.height);
  });
  const stageWidth = visible.length ? Math.max(maxX + 40, 1) : 1;
  const stageHeight = visible.length ? Math.max(maxY + 40, 1) : 1;
  svg.setAttribute("width", stageWidth);
  svg.setAttribute("height", stageHeight);
  svg.setAttribute("viewBox", `0 0 ${stageWidth} ${stageHeight}`);

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker>';
  svg.appendChild(defs);
  const scene = document.createElementNS(NS, "g");
  scene.setAttribute("id", "scene");
  svg.appendChild(scene);

  const matches = q => n => q && (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
  const isHit = matches(query);

  const regionLayer = document.createElementNS(NS, "g");
  regionLayer.setAttribute("id", "scope-regions");
  regions.forEach(region => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "scope-region");
    if (query && !region.nodeIds.some(id => isHit(visible.find(n => n.id === id)))) group.classList.add("dim");
    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("x", region.x);
    rect.setAttribute("y", region.y);
    rect.setAttribute("width", region.width);
    rect.setAttribute("height", region.height);
    rect.setAttribute("rx", 16);
    rect.setAttribute("fill", region.color);
    rect.setAttribute("fill-opacity", "0.055");
    rect.setAttribute("stroke", region.color);
    rect.setAttribute("stroke-opacity", "0.42");
    group.appendChild(rect);
    regionLayer.appendChild(group);
  });
  scene.appendChild(regionLayer);

  arcs.forEach(a => {
    const m1 = metrics[a.from], m2 = metrics[a.to];
    const p1 = m1._pos, p2 = m2._pos;
    const sx = p1.x + m1.width / 2;
    const sy = p1.y + m1.height;
    const tx = p2.x + m2.width / 2;
    const ty = p2.y;
    const dy = Math.max(ty - sy, 30);
    const c1y = sy + dy * 0.45;
    const c2y = ty - dy * 0.45;
    const d = `M ${sx} ${sy} C ${sx} ${c1y}, ${tx} ${c2y}, ${tx} ${ty}`;

    const line = document.createElementNS(NS, "path");
    line.setAttribute("d", d);
    const status = a.status || view.edges.find(e => e.from === a.from && e.to === a.to);
    const inferred = status === "inferred" || (status && status.status === "inferred");
    line.setAttribute("class", "edge" + (inferred ? " inferred" : ""));
    line.setAttribute("marker-end", "url(#arr)");
    if (query && !(isHit(visible.find(n => n.id === a.from)) && isHit(visible.find(n => n.id === a.to)))) line.classList.add("dim");
    scene.appendChild(line);

    if (a.label) {
      const len = line.getTotalLength();
      const pt = line.getPointAtLength(len / 2);
      const lw = textWidth(a.label, "10px system-ui, sans-serif") + 12;
      const bg = document.createElementNS(NS, "rect");
      bg.setAttribute("class", "elabel-bg");
      bg.setAttribute("x", pt.x - lw / 2);
      bg.setAttribute("y", pt.y - 10);
      bg.setAttribute("width", lw);
      bg.setAttribute("height", 20);
      bg.setAttribute("rx", 6);
      scene.appendChild(bg);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "elabel");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", pt.y + 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = a.label;
      scene.appendChild(t);
    }
  });

  visible.forEach(n => {
    const p = metrics[n.id]._pos;
    const m = metrics[n.id];
    const s = styleOf(n);
    const g = document.createElementNS(NS, "g");
    const classes = ["node", n.kind];
    if (n.id === view.nodes[0]?.id) classes.push("root");
    if (query && !isHit(n)) classes.push("dim");
    g.setAttribute("class", classes.join(" "));
    const shape = document.createElementNS(NS, "rect");
    shape.setAttribute("x", p.x); shape.setAttribute("y", p.y);
    shape.setAttribute("width", m.width); shape.setAttribute("height", m.height);
    shape.setAttribute("rx", 12);
    const fill = n.kind === "group"
      ? "#181b2b"
      : n.kind === "decision"
        ? "#241d0c"
        : n.kind === "loop"
          ? "#1c1f2e"
          : "#14171f";
    shape.setAttribute("fill", fill);
    shape.setAttribute("stroke", s.color);
    shape.setAttribute("stroke-opacity", n.kind === "group" ? "0.95" : "0.78");
    shape.setAttribute("stroke-width", n.id === view.nodes[0]?.id ? 2.5 : 1.8);
    if (query && isHit(n)) shape.setAttribute("class", "hit");
    g.appendChild(shape);

    if ((n.kind === "group" || n.kind === "function") && n.children && n.children.length) {
      const toggle = document.createElementNS(NS, "g");
      toggle.setAttribute("class", "collapse-toggle");
      toggle.setAttribute("role", "button");
      toggle.setAttribute("aria-label", collapsedNodes.has(n.id) ? "Развернуть" : "Свернуть");
      toggle.addEventListener("click", event => {
        event.stopPropagation();
        collapsedNodes.has(n.id) ? collapsedNodes.delete(n.id) : collapsedNodes.add(n.id);
        render();
      });
      const toggleShape = document.createElementNS(NS, "rect");
      toggleShape.setAttribute("x", p.x + m.width - 24);
      toggleShape.setAttribute("y", p.y + 6);
      toggleShape.setAttribute("width", 16);
      toggleShape.setAttribute("height", 16);
      toggleShape.setAttribute("rx", 5);
      toggleShape.setAttribute("fill", "#252a3d");
      toggleShape.setAttribute("stroke", s.color);
      toggleShape.setAttribute("stroke-opacity", "0.55");
      toggle.appendChild(toggleShape);
      const toggleLabel = document.createElementNS(NS, "text");
      toggleLabel.setAttribute("x", p.x + m.width - 16);
      toggleLabel.setAttribute("y", p.y + 18);
      toggleLabel.setAttribute("text-anchor", "middle");
      toggleLabel.setAttribute("fill", "#cbd0ff");
      toggleLabel.setAttribute("font-size", "13");
      toggleLabel.textContent = collapsedNodes.has(n.id) ? "+" : "−";
      toggle.appendChild(toggleLabel);
      g.appendChild(toggle);
    }

    if (m.hasIcon) {
      const icon = document.createElementNS(NS, "g");
      icon.setAttribute("transform", `translate(${p.x + 18} ${p.y + m.height/2 - 7}) scale(.55)`);
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", s.color);
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.innerHTML = ICON_PATHS[s.icon] || ICON_PATHS.Box;
      g.appendChild(icon);
    }

    const textX = m.hasIcon ? p.x + 38 : p.x + 12;
    const labelMaxW = m.width - (m.hasIcon ? 48 : 22);
    const labelLines = wrapText(n.label, labelMaxW, "500 11px system-ui, sans-serif");
    labelLines.forEach((ln, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "nlabel");
      t.setAttribute("x", textX);
      t.setAttribute("y", p.y + 17 + i * 13);
      t.textContent = ln;
      g.appendChild(t);
    });

    if (n.summary) {
      const summaryLines = wrapText(n.summary, labelMaxW, "9px system-ui, sans-serif");
      summaryLines.forEach((ln, i) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("class", "nsummary");
        t.setAttribute("x", textX);
        t.setAttribute("y", p.y + 19 + labelLines.length * 13 + 4 + i * 13);
        t.textContent = ln;
        g.appendChild(t);
      });
    }

    if (n.tests) {
      ["unit", "integration", "e2e"].forEach((k, i) => {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", p.x + m.width - 12 - i * 10); dot.setAttribute("cy", p.y + 11);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", n.tests[k] ? ["#34d399", "#60a5fa", "#f472b6"][i] : "#3f3f46");
        g.appendChild(dot);
      });
    }

    g.addEventListener("click", event => {
      if (event.metaKey) {
        if (n.children && n.children.length) {
          document.getElementById("sidebar").style.display = "none";
          openView(n.label, n.children, []);
        } else if (n.symbol) {
          document.getElementById("sidebar").style.display = "none";
          window.parent.postMessage({ type: "graphloom:navigate", symbolId: n.symbol }, "*");
        }
        return;
      }
      showSidebar(n);
    });
    scene.appendChild(g);
  });
}

function showSidebar(n) {
  const s = styleOf(n);
  document.getElementById("s-title").textContent = n.label;
  document.getElementById("s-meta").textContent =
    s.icon + " " + n.kind + (n.element_type ? " · " + n.element_type : "") +
    (n.confidence != null ? " · confidence " + n.confidence.toFixed(2) : "");
  document.getElementById("s-tests").innerHTML = n.tests
    ? ["unit", "integration", "e2e"].map(k =>
        '<span class="chip ' + (n.tests[k] ? "on" : "off") + '">' + k + "</span>").join("")
    : "";
  document.getElementById("s-summary").textContent = n.summary || "";

  const extra = document.getElementById("s-extra");
  extra.innerHTML = "";

  const refs = document.getElementById("s-refs");
  refs.innerHTML = "";
  if (n.cross_refs && n.cross_refs.length) {
    const title = document.createElement("div");
    title.className = "meta";
    title.textContent = "Связи:";
    refs.appendChild(title);
    const list = document.createElement("div");
    for (const ref of n.cross_refs) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = ref.label;
      a.style.display = "block";
      a.style.color = "#60a5fa";
      a.style.marginTop = "4px";
      a.style.textDecoration = "none";
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: ref.id, file: ref.file }, "*");
      });
      list.appendChild(a);
    }
    refs.appendChild(list);
  }

  if (n.kind === "call" && n.children && n.children.length) {
    const btn = document.createElement("button");
    btn.className = "expand";
    btn.textContent = "Раскрыть flow";
    btn.addEventListener("click", () => {
      document.getElementById("sidebar").style.display = "none";
      openView(n.label, n.children, []);
    });
    extra.appendChild(btn);
  }

  const code = document.getElementById("s-code");
  if (n.source && sources[n.source.file]) {
    const lines = sources[n.source.file].split("\n");
    const from = Math.max(1, n.source.start_line - 2);
    const to = Math.min(lines.length, n.source.end_line + 2);
    let html = "";
    for (let i = from; i <= to; i++) {
      const esc = lines[i - 1].replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const body = '<span class="ln">' + i + "</span>" + esc;
      html += i >= n.source.start_line && i <= n.source.end_line
        ? '<span class="hl">' + body + "</span>" : body + "\n";
    }
    code.innerHTML = html;
    code.style.display = "block";
  } else {
    code.style.display = "none";
  }
  document.getElementById("sidebar").style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("sidebar").style.display = "none";
});
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
</html>
