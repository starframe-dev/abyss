<title>Graphloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #09090b; color: #e4e4e7; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; min-height: 42px; padding: 6px 12px; background: rgba(9,9,11,.94);
         border-bottom: 1px solid #27272a; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #bar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  #bar .crumb { min-width: 0; flex: 1; font-size: 12px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers { display: flex; flex: 0 0 auto; gap: 7px; align-items: center; }
  .lchk { font-size: 11px; color: #a1a1aa; display: flex; gap: 3px; align-items: center; cursor: pointer; white-space: nowrap; }
  #search { flex: 0 0 150px; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; color: #e4e4e7;
            padding: 4px 8px; font-size: 12px; width: 150px; }
  .nav, .tool { background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 6px;
         cursor: pointer; font-size: 12px; }
  .nav { padding: 4px 9px; }
  .nav:disabled, .tool:disabled { opacity: .4; cursor: default; }
  .tool { width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .tool:hover:not(:disabled), .nav:hover:not(:disabled) { background: #3f3f46; }
  .tool svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #stage { position: fixed; inset: 0; top: 42px; overflow: auto; padding: 0; background: #0b0d12; }
  #stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .22;
                  background-image: linear-gradient(#202533 1px, transparent 1px), linear-gradient(90deg, #202533 1px, transparent 1px);
                  background-size: 32px 32px; }
  svg { display: block; position: relative; z-index: 1; overflow: visible; }
  .node { cursor: pointer; }
  .node rect, .node polygon { transition: filter .15s, stroke-width .15s; }
  .node:hover rect, .node:hover polygon { filter: brightness(1.18); }
  .node.root rect, .node.root polygon { stroke-width: 2.5; }
  .node.dim, .edge.dim { opacity: .14; }
  .edge { stroke: #4b5563; stroke-width: 1.25; fill: none; opacity: .9; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .elabel-bg { fill: #09090b; stroke: #27272a; stroke-width: 1; }
  .elabel { font-size: 10px; fill: #a1a1aa; }
  .nlabel { font-size: 11px; fill: #f4f4f5; font-weight: 500; }
  .nsummary { font-size: 9px; fill: #71717a; }
  .nkind { font-size: 11px; }
  .hit { stroke: #facc15; stroke-width: 2.5; }
  #sidebar { position: fixed; top: 42px; right: 0; bottom: 0; width: 380px; background: #18181b;
             border-left: 1px solid #27272a; padding: 16px; overflow: auto; display: none; z-index: 6; }
  #sidebar h2 { font-size: 16px; margin-bottom: 2px; padding-right: 20px; }
  #sidebar .meta { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  #close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #71717a;
           background: none; border: none; font-size: 16px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
  .chip.on { background: #064e3b; color: #6ee7b7; }
  .chip.off { background: #27272a; color: #71717a; }
  pre.code { margin-top: 12px; background: #09090b; border: 1px solid #27272a; border-radius: 8px;
             padding: 10px; font: 11px/1.6 ui-monospace, monospace; overflow: auto; }
  pre.code .ln { color: #52525b; display: inline-block; width: 34px; user-select: none; }
  pre.code .hl { background: #27272a; display: block; }
  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;
            padding: 5px 12px; cursor: pointer; font-size: 12px; }
  .expand { margin-top: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px;

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
function textWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

function wrapText(text, maxW, font) {
  const words = (text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (textWidth(test, font) <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [text || ""];
}

function nodeMetrics(n) {
  const s = styleOf(n);
  const isDecision = n.kind === "decision";
  const labelFont = "500 11px system-ui, sans-serif";
  const summaryFont = "9px system-ui, sans-serif";
  const maxTextW = isDecision ? 170 : 200;
  const labelLines = wrapText(n.label, maxTextW, labelFont);
  const summaryLines = n.summary && !isDecision ? wrapText(n.summary, maxTextW, summaryFont) : [];
  const labelW = Math.max(...labelLines.map(l => textWidth(l, labelFont)), 0);
  const summaryW = Math.max(...summaryLines.map(l => textWidth(l, summaryFont)), 0);
  const hasIcon = !isDecision;
  const innerW = Math.max(labelW, summaryW) + (hasIcon ? 32 : 0);
  const minW = isDecision ? 156 : 134;
  const maxW = isDecision ? 220 : 260;
  const width = Math.max(minW, Math.min(maxW, innerW + 24));
  const lineH = 13;
  const labelH = 11 + (labelLines.length - 1) * lineH;
  const summaryH = summaryLines.length ? 4 + summaryLines.length * lineH : 0;
  const height = 22 + labelH + summaryH;
  return { width, height, labelLines, summaryLines, labelH, summaryH, isDecision, hasIcon, color: s.color, icon: s.icon };
}

function sequentialize(arcs, visible, level) {
  if (level !== "file" && level !== "function") return arcs;
  const lineOf = id => {
    const n = visible.find(x => x.id === id);
    return n && n.source ? n.source.start_line : 0;
  };
  const out = {};
  arcs.forEach(a => { (out[a.from] = out[a.from] || []).push(a); });
  const keep = new Set();
  const add = [];
  Object.keys(out).forEach(src => {
    const srcNode = visible.find(x => x.id === src);
    if (!srcNode || srcNode.kind === "decision") return;
    const outs = out[src]
      .filter(a => visible.find(x => x.id === a.to))
      .slice()
      .sort((a, b) => lineOf(a.to) - lineOf(b.to));
    if (outs.length < 2) return;
    keep.add(`${outs[0].from}→${outs[0].to}`);
    for (let i = 1; i < outs.length; i++) {
      add.push({ from: outs[i - 1].to, to: outs[i].to, label: outs[i].label });
    }
  });
  return arcs.filter(a => {
    const srcNode = visible.find(x => x.id === a.from);
    if (srcNode && srcNode.kind === "decision") return true;
    if (!out[a.from] || out[a.from].length < 2) return true;
    return keep.has(`${a.from}→${a.to}`);
  }).concat(add);
}

function layeredLayout(nodes, edges) {
  const visible = nodes.filter(n => activeLayers.has(n.layer));
  const ids = new Set(visible.map(n => n.id));
  let arcs = edges.filter(e => ids.has(e.from) && ids.has(e.to)).map(e => ({ ...e }));
  visible.forEach(n => {
    if (n.kind === "decision" && n.branches) {
      n.branches.forEach(b => {
        if (ids.has(b.target)) arcs.push({ from: n.id, to: b.target, label: b.condition });
      });
    }
  });
  arcs = sequentialize(arcs, visible, viz.level);

  const layer = {};
  visible.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < visible.length; i++) {
    arcs.forEach(a => { if (layer[a.to] <= layer[a.from]) layer[a.to] = layer[a.from] + 1; });
  }

  const metrics = {};
  visible.forEach(n => metrics[n.id] = nodeMetrics(n));

  const groups = new Map();
  visible.forEach(n => {
    const l = layer[n.id];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(n);
  });

  const preds = {};
  arcs.forEach(a => { (preds[a.to] = preds[a.to] || []).push(a.from); });

  const sortedLayers = [...groups.keys()].sort((a, b) => a - b);
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    group.forEach(n => {
      const ps = (preds[n.id] || []).filter(p => metrics[p]._pos);
      n._bary = ps.length ? ps.reduce((s, p) => s + metrics[p]._pos.x + metrics[p].width / 2, 0) / ps.length : Infinity;
    });
    group.sort((a, b) => (a._bary - b._bary) || a.id.localeCompare(b.id));
    let x = 40;
    group.forEach(n => {
      metrics[n.id]._pos = { x, y: 0 };
      x += metrics[n.id].width + 40;
    });
  });

  let maxLayerWidth = 0;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const last = group[group.length - 1];
    const w = metrics[last.id]._pos.x + metrics[last.id].width;
    if (w > maxLayerWidth) maxLayerWidth = w;
  });

  let y = 40;
  sortedLayers.forEach(l => {
    const group = groups.get(l);
    const maxH = Math.max(...group.map(n => metrics[n.id].height));
    group.forEach(n => { metrics[n.id]._pos.y = y + (maxH - metrics[n.id].height) / 2; });
    const layerW = Math.max(...group.map(n => metrics[n.id]._pos.x + metrics[n.id].width));
    const offset = (maxLayerWidth - layerW) / 2;
    group.forEach(n => { metrics[n.id]._pos.x += Math.max(0, offset); });
    y += maxH + 70;
  });

  return { visible, arcs, metrics };
}

function treeLayout(nodes) {
  const root = nodes[0];
  function filter(node) {
    const children = (node.children || [])
      .filter(c => activeLayers.has(c.layer))
      .map(filter);
    return { node, children };
  }
  const tree = filter(root);
  const flat = [];

  function collect(t) {
    flat.push(t.node);
    t.children.forEach(collect);
  }
  collect(tree);

  const metrics = {};
  const columnWidth = Math.max(
    TREE_COLUMN_WIDTH,
    ...flat.map(node => nodeMetrics(node).width + 40)
  );
  let y = 40;
  flat.forEach(node => {
    const metric = nodeMetrics(node);
    metric._pos = { x: 40 + (columnWidth - metric.width) / 2, y };
    node._metrics = metric;
    metrics[node.id] = metric;
    y += metric.height + TREE_GAP_Y;
  });

  // Keep the source order as a single top-to-bottom flow.
  const edges = [];
  for (let i = 1; i < flat.length; i++) {
    edges.push({ from: flat[i - 1].id, to: flat[i].id, label: null, status: null });
  }
  return { visible: flat, arcs: edges, metrics };
}

function isTreeView(view) {
  return view.nodes.length === 1 && view.edges.length === 0 && view.nodes[0].children && view.nodes[0].children.length > 0;
}

    const line = document.createElementNS(NS, "path");
    line.setAttribute("d", d);
    const status = view.edges.find(e => e.from === a.from && e.to === a.to);
    line.setAttribute("class", "edge" + (status && status.status === "inferred" ? " inferred" : ""));
    line.setAttribute("marker-end", "url(#arr)");
    if (query && !(isHit(visible.find(n => n.id === a.from)) && isHit(visible.find(n => n.id === a.to)))) line.classList.add("dim");
    scene.appendChild(line);

    if (a.label) {
      const len = line.getTotalLength();
      const pt = line.getPointAtLength(len / 2);
      const lw = textWidth(a.label, "10px system-ui, sans-serif") + 12;
      const bg = document.createElementNS(NS, "rect");
      bg.setAttribute("class", "elabel-bg");
      bg.setAttribute("x", pt.x - lw / 2);
      bg.setAttribute("y", pt.y - 10);
      bg.setAttribute("width", lw);
      bg.setAttribute("height", 20);
      bg.setAttribute("rx", 6);
      scene.appendChild(bg);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "elabel");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", pt.y + 3);
      t.setAttribute("text-anchor", "middle");
      t.textContent = a.label;
      scene.appendChild(t);
    }
  });

  visible.forEach(n => {
    const p = metrics[n.id]._pos;
    const m = metrics[n.id];
    const s = styleOf(n);
    const g = document.createElementNS(NS, "g");
    const classes = ["node", n.kind];
    if (n.id === view.nodes[0]?.id) classes.push("root");
    if (query && !isHit(n)) classes.push("dim");
    g.setAttribute("class", classes.join(" "));
    let shape;
    if (n.kind === "decision") {
      shape = document.createElementNS(NS, "polygon");
      const w = m.width, h = m.height;
      shape.setAttribute("points", `${p.x + w/2},${p.y} ${p.x + w},${p.y + h/2} ${p.x + w/2},${p.y + h} ${p.x},${p.y + h/2}`);
    } else {
      shape = document.createElementNS(NS, "rect");
      shape.setAttribute("x", p.x); shape.setAttribute("y", p.y);
      shape.setAttribute("width", m.width); shape.setAttribute("height", m.height);
      shape.setAttribute("rx", 12);
    }
    const fill = n.kind === "group"
      ? "#181b2b"
      : n.kind === "decision"
        ? "#241d0c"
        : "#14171f";
    shape.setAttribute("fill", fill);
    shape.setAttribute("stroke", s.color);
    shape.setAttribute("stroke-opacity", n.kind === "group" ? "0.95" : "0.78");
    shape.setAttribute("stroke-width", n.id === view.nodes[0]?.id ? 2.5 : 1.8);
    if (query && isHit(n)) shape.setAttribute("class", "hit");
    g.appendChild(shape);

    if (m.hasIcon) {
      const icon = document.createElementNS(NS, "g");
      icon.setAttribute("transform", `translate(${p.x + 18} ${p.y + m.height/2 - 7}) scale(.55)`);
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", s.color);
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.innerHTML = ICON_PATHS[s.icon] || ICON_PATHS.Box;
      g.appendChild(icon);
    }

    const textX = m.hasIcon ? p.x + 38 : p.x + 12;
    const labelMaxW = m.width - (m.hasIcon ? 48 : 22);
    const labelLines = wrapText(n.label, labelMaxW, "500 11px system-ui, sans-serif");
    labelLines.forEach((ln, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "nlabel");
      t.setAttribute("x", textX);
      t.setAttribute("y", p.y + 17 + i * 13);
      t.textContent = ln;
      g.appendChild(t);
    });

    if (n.summary && n.kind !== "decision") {
      const summaryLines = wrapText(n.summary, labelMaxW, "9px system-ui, sans-serif");
      summaryLines.forEach((ln, i) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("class", "nsummary");
        t.setAttribute("x", textX);
        t.setAttribute("y", p.y + 19 + labelLines.length * 13 + 4 + i * 13);
        t.textContent = ln;
        g.appendChild(t);
      });
    }

    if (n.tests) {
      ["unit", "integration", "e2e"].forEach((k, i) => {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", p.x + m.width - 12 - i * 10); dot.setAttribute("cy", p.y + 11);
        dot.setAttribute("r", 3.5);
        dot.setAttribute("fill", n.tests[k] ? ["#34d399", "#60a5fa", "#f472b6"][i] : "#3f3f46");
        g.appendChild(dot);
      });
    }

    g.addEventListener("click", event => {
      if (event.metaKey) {
        if (n.children && n.children.length) {
          document.getElementById("sidebar").style.display = "none";
          openView(n.label, n.children, []);
        } else if (n.symbol) {
          document.getElementById("sidebar").style.display = "none";
          window.parent.postMessage({ type: "graphloom:navigate", symbolId: n.symbol }, "*");
        }
        return;
      }
      showSidebar(n);
    });
    scene.appendChild(g);
  });
}

function showSidebar(n) {
  const s = styleOf(n);
  document.getElementById("s-title").textContent = n.label;
  document.getElementById("s-meta").textContent =
    s.icon + " " + n.kind + (n.element_type ? " · " + n.element_type : "") +
    (n.confidence != null ? " · confidence " + n.confidence.toFixed(2) : "");
  document.getElementById("s-tests").innerHTML = n.tests
    ? ["unit", "integration", "e2e"].map(k =>
        '<span class="chip ' + (n.tests[k] ? "on" : "off") + '">' + k + "</span>").join("")
    : "";
  document.getElementById("s-summary").textContent = n.summary || "";

  const extra = document.getElementById("s-extra");
  extra.innerHTML = "";

  const refs = document.getElementById("s-refs");
  refs.innerHTML = "";
  if (n.cross_refs && n.cross_refs.length) {
    const title = document.createElement("div");
    title.className = "meta";
    title.textContent = "Связи:";
    refs.appendChild(title);
    const list = document.createElement("div");
    for (const ref of n.cross_refs) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = ref.label;
      a.style.display = "block";
      a.style.color = "#60a5fa";
      a.style.marginTop = "4px";
      a.style.textDecoration = "none";
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.parent.postMessage({ type: "graphloom:navigate", symbolId: ref.id, file: ref.file }, "*");
      });
      list.appendChild(a);
    }
    refs.appendChild(list);
  }

  if (n.kind === "call" && n.children && n.children.length) {
    const btn = document.createElement("button");
    btn.className = "expand";
    btn.textContent = "Раскрыть flow";
    btn.addEventListener("click", () => {
      document.getElementById("sidebar").style.display = "none";
      openView(n.label, n.children, []);
    });
    extra.appendChild(btn);
  }

  const code = document.getElementById("s-code");
  if (n.source && sources[n.source.file]) {
    const lines = sources[n.source.file].split("\n");
    const from = Math.max(1, n.source.start_line - 2);
    const to = Math.min(lines.length, n.source.end_line + 2);
    let html = "";
    for (let i = from; i <= to; i++) {
      const esc = lines[i - 1].replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const body = '<span class="ln">' + i + "</span>" + esc;
      html += i >= n.source.start_line && i <= n.source.end_line
        ? '<span class="hl">' + body + "</span>" : body + "\n";
    }
    code.innerHTML = html;
    code.style.display = "block";
  } else {
    code.style.display = "none";
  }
  document.getElementById("sidebar").style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("sidebar").style.display = "none";
});
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
